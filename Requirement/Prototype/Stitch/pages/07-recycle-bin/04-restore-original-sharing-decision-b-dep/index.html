<script>
        // Simple micro-interaction for the confirm button
        const confirmBtn = document.querySelector('button.bg-primary');
        confirmBtn.addEventListener('click', () => {
            confirmBtn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> 正在恢复...';
            confirmBtn.classList.add('opacity-80');
            setTimeout(() => {
                alert('媒体已成功恢复并同步至家庭共享状态。');
                window.location.reload();
            }, 1200);
        });

        // Cancel button interaction
        const cancelBtn = document.querySelector('button.border-outline-variant');
        cancelBtn.addEventListener('click', () => {
            const card = document.querySelector('.fade-in');
            card.style.transform = 'scale(0.95)';
            card.style.opacity = '0';
            card.style.transition = 'all 0.3s ease-out';
            setTimeout(() => {
                alert('已返回回收站');
            }, 300);
        });
    </script>
