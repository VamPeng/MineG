</header>
<!-- Main Content Canvas -->

<!-- Media Preview Container -->

<div class="w-full h-full bg-cover bg-center brightness-75 transition-all duration-700 blur-[2px]" data-alt="A warm and nostalgia-inducing photograph of a family gathering around a wooden dining table in a sunlit room. The image features soft, natural light streaming through a window, highlighting a bowl of fresh fruit and scattered family snapshots. The overall aesthetic is minimalist and modern, with a palette of warm creams, sage greens, and soft earthy tones, creating a sense of private security and cherished memory." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD4zrodmUPDGqfCE5C1Tddx63WUqZ8EgspztwdXi562oR-_Q83Wnu5jX1OsuQW5z6sXx8zmz1W9MuJ391r_-F83FbV1S9J4OH1_SVdsTaYhdjvhjT8TbUUeXTcJvSB49GhhipNK-TSZMpqratNwUxq7KyWODrN35lRD2yPeX5SxbA4vf_odfjHL1GKhecD7smM66X_K1a40jlGpxyotyuwM8yajh4Ana5xzH4-ofyhH9XF0ki0FmI6Rac-SCOzL_LpReWCbySNJVa8')"></div>
</div>
<!-- Confirmation Dialog -->
<div class="relative z-10 w-full max-w-md bg-surface/95 backdrop-blur-md rounded-xl p-lg transform translate-y-[-20px]">
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">确定恢复此媒体？</h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-lg leading-relaxed">
                媒体将恢复至私人空间，不会自动重新同步到家庭相册。
            </p>
<div class="flex flex-col gap-3">
<button class="w-full bg-primary text-on-primary py-3 px-6 rounded-lg font-bold hover:opacity-90 active:scale-95 transition-all" data-confirm-restore>
                    确认恢复
                </button>
<button class="w-full bg-transparent border border-outline-variant text-on-surface-variant py-3 px-6 rounded-lg font-medium hover:bg-surface-variant/20 active:scale-95 transition-all" data-cancel-restore>
                    取消
                </button>
</div>
</div>
</main>
<!-- Simple micro-interaction script for the buttons -->
<script>
        document.querySelector('[data-confirm-restore]').addEventListener('click', function() {
            this.textContent = '已恢复到私人空间';
            this.disabled = true;
            this.classList.add('opacity-80');
        });

        document.querySelector('[data-cancel-restore]').addEventListener('click', function() {
            const dialog = this.closest('.relative.z-10');
            dialog.style.opacity = '0.5';
            dialog.style.transform = 'scale(0.98) translateY(-20px)';
            setTimeout(() => {
                window.location.href = '../01-recycle-bin-populated/index.html';
            }, 200);
        });
    </script>
