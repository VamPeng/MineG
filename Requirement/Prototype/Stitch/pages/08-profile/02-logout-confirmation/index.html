<script>
        // Simple logic to simulate modal handling
        document.addEventListener('DOMContentLoaded', () => {
            const cancelButton = document.querySelectorAll('button')[document.querySelectorAll('button').length - 1];
            const confirmButton = document.querySelectorAll('button')[document.querySelectorAll('button').length - 2];
            const mainContent = document.querySelector('main');
            const nav = document.querySelector('nav');
            const modal = document.querySelector('.fixed.inset-0.z-50');

            cancelButton.addEventListener('click', () => {
                modal.classList.add('opacity-0', 'pointer-events-none');
                mainContent.classList.remove('blur-md');
                nav.classList.remove('blur-md');
                nav.classList.remove('pointer-events-none');
            });

            confirmButton.addEventListener('click', () => {
                alert('正在退出...');

            });
        });
