<script>
        // The prototype treats a click as a successful system authorization result.
        // Native apps should navigate only after the operating system reports full access.
        const permissionButton = document.querySelector('[data-action="request-photo-permission"]');
        permissionButton?.addEventListener('click', () => {
            window.location.href = '../../03-private-space/01-private-space-overview/index.html';
