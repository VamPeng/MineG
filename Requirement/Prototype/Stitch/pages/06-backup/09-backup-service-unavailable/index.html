<script>
        // Simple ripple effect or micro-interaction logic
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                if(this.innerText.includes('重试')) {
                    const btn = this;
                    const originalContent = btn.innerHTML;
                    btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span><span>正在检查...</span>';
                    btn.disabled = true;
                    btn.classList.add('opacity-80');
                    
                    setTimeout(() => {
                        btn.innerHTML = originalContent;
                        btn.disabled = false;
                        btn.classList.remove('opacity-80');
                    }, 2000);
                }
            });
        });
    </script>
