<script>
        // Micro-interaction: Animated Counter
        const counterElement = document.getElementById('pending-count');
        const progressBar = document.getElementById('progress-bar');
        let count = 1204;
        let progress = 35;

        function updateSimulation() {
            // Randomly increment count to simulate scanning
            const increment = Math.floor(Math.random() * 5);
            count += increment;
            
            // Format number with commas
            counterElement.innerText = count.toLocaleString();

            // Progress bar simulation
            if (progress < 92) {
                progress += 0.05;
                progressBar.style.width = `${progress}%`;
            }

            // Pulse effect when count increases
            if (increment > 0) {
                counterElement.classList.add('scale-105', 'text-primary-container');
                setTimeout(() => {
                    counterElement.classList.remove('scale-105', 'text-primary-container');
                }, 100);
            }

            requestAnimationFrame(() => {
                setTimeout(updateSimulation, 200 + Math.random() * 800);
            });
        }

        updateSimulation();

        // Handle Active Navigation Mapping
        // The "Backup" tab is active as this is the backup center status
    </script>
