<script>
        // Soft interaction for scrapbook elements
        document.querySelectorAll('.scrapbook-card').forEach(card => {
            card.addEventListener('touchstart', () => {
                card.style.transform = 'translateY(-2px) scale(0.99)';
                card.style.transition = 'transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1)';

            card.addEventListener('touchend', () => {
                card.style.transform = 'translateY(0) scale(1)';
