<script>
        const mediaItems = [...document.querySelectorAll('.media-grid-item')];
        const mineMode = new URLSearchParams(window.location.search).get('view') === 'mine';

        if (mineMode) {
            document.title = 'MineG 我分享的';
            document.querySelector('script[data-mineg-nav]').dataset.minegNav = 'profile';
            document.querySelector('[data-home-tabs]').outerHTML = `
              <header class="sticky top-0 z-30 flex min-h-14 items-center bg-surface/95 px-3 backdrop-blur-md">
                <a class="grid h-10 w-10 place-items-center rounded-full text-primary" href="../../08-profile/01-profile-overview/index.html" aria-label="返回个人中心">
                  <span class="material-symbols-outlined">arrow_back</span>
                </a>
                <h1 class="flex-1 pr-10 text-center text-lg font-semibold">我分享的</h1>
              </header>`;

            mediaItems.forEach(item => { item.hidden = item.dataset.sharedByMe !== 'true'; });
            document.querySelectorAll('[data-media-grid]').forEach(grid => {
                const hasVisibleItems = [...grid.querySelectorAll('.media-grid-item')].some(item => !item.hidden);
                document.querySelectorAll(`[data-date-group="${grid.dataset.dateGroup}"]`).forEach(element => {
                    element.hidden = !hasVisibleItems;
                });
            });
        }

        mediaItems.forEach(item => {
            item.addEventListener('touchstart', function() {
                this.classList.add('scale-95');
            });
            item.addEventListener('touchend', function() {
                this.classList.remove('scale-95');
            });
        });
    </script>
