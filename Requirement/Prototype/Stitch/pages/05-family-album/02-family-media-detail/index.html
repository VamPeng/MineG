    body {

<body class="antialiased overflow-hidden select-none">
<!-- Main Content Canvas -->
<main class="relative w-full h-[calc(100vh-80px)] flex items-center justify-center px-margin-mobile sm:px-margin-tablet">
<!-- Photo Container with subtle Tonal Layering -->
<div class="relative w-full h-full max-w-4xl flex items-center justify-center animate-in fade-in zoom-in-95 duration-700">
<div class="w-full h-full bg-surface-container-low rounded-xl overflow-hidden shadow-[0_12px_40px_-12px_rgba(0,0,0,0.05)] transition-all duration-500 hover:shadow-[0_20px_60px_-15px_rgba(0,0,0,0.08)]">
<img class="w-full h-full object-contain bg-surface-container" data-alt="A heartwarming, high-resolution family photograph captured in soft, natural morning light. A father and daughter are sitting together in a lush green garden, their expressions filled with genuine joy and warmth. The photography style is minimalist and clean, utilizing the MineG brand color palette of soft creams, sage greens, and warm terracotta tones. The lighting is diffused and nostalgic, creating a feeling of safety, privacy, and precious memories in a digital hearth environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAro2nExRgfYv36TBWH_GIsEgCNZjLqCmUwwnh0bw5kwpPmvlfdJbGG9_0EWu4D0MnLyl2QE8FiSJ4fzPkMpSAeg6Iip3Tw6zj-4uwCVu-n5ZH7idqiKfYG-l_lz4i9HdfOCiKVcP4fJBuaujfpOvRlAJJYqfQfE3wMOJWmcaq02VekERCf9TbinajagRhTqRdUd0hw5zynnV6Zk_ujXtdej_Gp-C38pBhkrO-jVh9izJx7YftD5OX1mRLH0FcQdWDYFt-89EqK5YQ"/>
</div>
</div>
</main>
<!-- Bottom Metadata Section -->
<footer class="fixed bottom-0 w-full h-20 bg-surface/80 backdrop-blur-md flex flex-col items-center justify-center gap-1 border-none shadow-none z-10">
<!-- "來自：晨曦爸爸" - Strict Labeling -->
<div class="flex items-center gap-2">
<span class="font-label-sm text-label-sm text-outline">来自：</span>
<span class="font-label-sm text-label-sm text-on-surface font-semibold">晨曦爸爸</span>
</div>
<!-- Date - Strict Labeling -->
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[14px] text-outline">calendar_today</span>
<time class="font-label-sm text-label-sm text-outline-variant">2024年10月20日</time>
</div>
</footer>
<!-- Anti-Interaction Overlay (Visual Reinforcement of Read-Only) -->
<div class="fixed inset-0 pointer-events-none border-[12px] border-surface/10 rounded-3xl z-50"></div>
<script>
        // Micro-interaction: prevent context menu to reinforce "Read Only"
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Simple Fade-in effect for the main image
        window.addEventListener('load', () => {
            const img = document.querySelector('img');
            if (img) {
                img.style.opacity = '0';
                img.style.transition = 'opacity 0.8s ease-out';
                setTimeout(() => {
                    img.style.opacity = '1';
                }, 50);
            }
        });
    </script>
</body></html>
