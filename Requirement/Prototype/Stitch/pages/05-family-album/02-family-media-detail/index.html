<script>
        // Simple Fade-in effect for the main image
        window.addEventListener('load', () => {
            const img = document.querySelector('img');
            if (img) {
                img.style.opacity = '0';
                img.style.transition = 'opacity 0.8s ease-out';
                setTimeout(() => {
                    img.style.opacity = '1';
                }, 50);
            }
        });
