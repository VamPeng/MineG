                    "on-tertiary-fixed": "#1c1c19",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .backdrop-blur-custom {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .toast-entrance {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%) translateX(-50%); opacity: 0; }
            to { transform: translateY(0) translateX(-50%); opacity: 1; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- Top AppBar (Source: Shared Components) -->
<header class="z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md sticky top-0 docked full-width flex justify-between items-center w-full px-margin-mobile py-sm">
<button class="text-primary dark:text-primary-fixed-dim hover:bg-surface-container-high transition-colors p-sm rounded-full active:scale-95 transition-transform duration-200">
<span aria-hidden="true">←</span>
</button>
<div class="w-10 h-10" aria-hidden="true"></div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col relative">
<!-- Media Detail Hero Section -->
<div class="px-margin-mobile pt-gutter pb-xl flex-1 flex flex-col gap-lg">
<!-- Hero Image Card -->
<div class="relative w-full aspect-[4/5] rounded-xl overflow-hidden shadow-md bg-surface-container-low group">
<img class="w-full h-full object-cover" data-alt="A warm, nostalgic high-quality photograph of a family gathering during a sun-drenched afternoon. The scene features soft golden hour lighting filtering through tall trees onto a rustic wooden table filled with home-cooked meals. The overall aesthetic is minimalist yet tactile, using a palette of warm creams and sage greens to evoke a sense of private security and cherished memories. The composition is clean with low visual density, focusing on the intimate connection between family members." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAdI5d_Iz7DlT9mu0qtQV3hUr3HwF1HsGiWbO7EuDO2T-ZuZSug7Cfu7HQddkENjSrA5k1OmK5sgXQcL2rglIiXV_XPNjqqSD5GZ9sSUk83ECbqjcY6xM0n5Cg8Ck-RCtJbMG9h7OKg6kLsRE3JYLXGmOEzq-veF76gDxC2mRqlYZ6eDv06OO1ybTX-Ke5_ohgrrVD6cDy9JUS8WAA6GMaacsK6cJgzHQi7zlF-NW3dxhkeZfBjhmy6KmYSJx-3Rwyh2AL1EOSmmCM"/>
</div>
</div>
<!-- Failure Toast Notification (Floating Actionable) -->
<div class="fixed bottom-32 left-1/2 -translate-x-1/2 w-[calc(100%-40px)] max-w-md z-[60] toast-entrance" id="errorToast">
<div class="bg-white rounded-xl shadow-lg border-l-4 border-error p-md flex items-start gap-md">
<div class="flex-1">
<h4 class="text-body-md font-bold text-on-surface">保存失败</h4>
<p class="text-label-sm text-on-surface-variant" id="errorMsg">网络异常，保存失败</p>
<div class="mt-md flex gap-sm">
<button class="bg-primary text-on-primary text-label-sm font-label-sm py-sm px-lg rounded-md hover:bg-primary-container transition-colors active:scale-95" onclick="retryAction()">
                            重试
                        </button>
<button class="bg-transparent border border-outline-variant text-on-surface-variant text-label-sm font-label-sm py-sm px-lg rounded-md hover:bg-surface-container-high transition-colors" onclick="closeToast()">
                            取消
                        </button>
</div>
</div>
<button class="text-outline-variant hover:text-on-surface-variant" onclick="closeToast()">
<span>关闭</span>
</button>
</div>
</div>
</main>
<nav aria-hidden="false" class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter pb-lg pt-sm bg-surface dark:bg-surface-dim shadow-[0_-2px_12px_rgba(0,0,0,0.05)] rounded-t-xl" id="media-actions">
<button aria-label="下载" class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest active:scale-90 transition-all">
<span>下载</span>
</button>
<button aria-label="共享" class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest active:scale-90 transition-all">
<span>共享</span>
</button>
<button aria-label="删除" class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest active:scale-90 transition-all">
<span>删除</span>
</button>
</nav>
<script>
        function toggleMediaActions() {
            const actions = document.getElementById('media-actions');
            const toggle = document.getElementById('action-toggle');
            const icon = document.getElementById('action-toggle-icon');
            const isExpanded = toggle.getAttribute('aria-expanded') === 'true';

            toggle.setAttribute('aria-expanded', String(!isExpanded));
            toggle.setAttribute('aria-label', isExpanded ? '展开操作' : '收起操作');
            toggle.classList.toggle('bottom-lg', isExpanded);
            toggle.classList.toggle('bottom-24', !isExpanded);
            actions.setAttribute('aria-hidden', String(isExpanded));
            actions.classList.toggle('translate-y-full', isExpanded);
            actions.classList.toggle('translate-y-0', !isExpanded);
            actions.classList.toggle('opacity-0', isExpanded);
            actions.classList.toggle('opacity-100', !isExpanded);
            actions.classList.toggle('pointer-events-none', isExpanded);
            icon.textContent = isExpanded ? 'keyboard_arrow_up' : 'keyboard_arrow_down';
        }

        function closeToast() {
            const toast = document.getElementById('errorToast');
            toast.style.transition = 'all 0.3s ease-in';
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(20px) translateX(-50%)';
            setTimeout(() => toast.remove(), 300);
        }

        function retryAction() {
            const btn = event.currentTarget;
            const originalText = btn.innerText;
            btn.innerText = '正在重试...';
            btn.disabled = true;
            btn.classList.add('opacity-50');

            // Simulate a retry attempt
            setTimeout(() => {
                const msg = document.getElementById('errorMsg');
                msg.innerText = '保存失败，请重试';
                btn.innerText = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }, 1500);
        }

        // Interaction for detail view
        document.addEventListener('DOMContentLoaded', () => {
            console.log('Media detail loaded with error state simulation.');
        });
    </script>
</body></html>
