<!-- Modal Dialog -->
<div class="relative w-full max-w-sm bg-surface rounded-xl shadow-xl overflow-hidden transform scale-95 transition-transform duration-300 pointer-events-auto">
<div class="p-lg">
<!-- Icon/Header -->
<div class="flex items-center gap-md mb-md">
<h3 class="font-headline-md text-on-surface">移入回收站？</h3>
</div>

                </p>

                        移入回收站
                    </button>
<button class="w-full bg-transparent text-primary py-md rounded-lg font-label-sm text-label-sm font-semibold hover:bg-surface-container-high transition-colors active:scale-95 duration-150 border border-outline-variant" onclick="closeDeleteModal()">
                        取消
                    </button>
</div>
</div>
</div>
</div>
<script>
        function toggleMediaActions() {
            const actions = document.getElementById('media-actions');
            const toggle = document.getElementById('action-toggle');
            const icon = document.getElementById('action-toggle-icon');
            const isExpanded = toggle.getAttribute('aria-expanded') === 'true';

            toggle.setAttribute('aria-expanded', String(!isExpanded));
            toggle.setAttribute('aria-label', isExpanded ? '展开操作' : '收起操作');
            toggle.classList.toggle('bottom-lg', isExpanded);
            toggle.classList.toggle('bottom-24', !isExpanded);
            actions.setAttribute('aria-hidden', String(isExpanded));
            actions.classList.toggle('translate-y-full', isExpanded);
            actions.classList.toggle('translate-y-0', !isExpanded);
            actions.classList.toggle('opacity-0', isExpanded);
            actions.classList.toggle('opacity-100', !isExpanded);
            actions.classList.toggle('pointer-events-none', isExpanded);
            icon.textContent = isExpanded ? 'keyboard_arrow_up' : 'keyboard_arrow_down';
        }

        function openDeleteModal() {
            const modal = document.getElementById('deleteModal');
            const dialog = modal.querySelector('div.relative');
            
            modal.classList.remove('pointer-events-none', 'opacity-0');
            modal.classList.add('pointer-events-auto', 'opacity-100');
            dialog.classList.remove('scale-95');
            dialog.classList.add('scale-100');
            
            // Prevent scrolling on body
            document.body.style.overflow = 'hidden';
        }

        function closeDeleteModal() {
            const modal = document.getElementById('deleteModal');
            const dialog = modal.querySelector('div.relative');
            
            modal.classList.add('opacity-0');
            modal.classList.remove('opacity-100');
            dialog.classList.add('scale-95');
            dialog.classList.remove('scale-100');
            
            setTimeout(() => {
                modal.classList.add('pointer-events-none');
                modal.classList.remove('pointer-events-auto');
                document.body.style.overflow = 'auto';
            }, 300);
        }

        function confirmDelete() {
            // Logic for deletion would go here
            console.log('Media moved to trash');
            closeDeleteModal();
            // Simulate navigation back or toast
        }

        // Auto-open modal for demonstration since that's the prompt requirement
        window.onload = () => {
            setTimeout(openDeleteModal, 500);
        };
    </script>
