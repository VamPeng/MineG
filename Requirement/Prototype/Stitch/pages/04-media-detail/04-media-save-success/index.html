            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }

        .animate-toast {
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

<body class="bg-surface font-body-md text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<!-- Top AppBar -->
<header class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md sticky top-0 z-50 flex justify-between items-center w-full px-margin-mobile py-sm">
<button class="text-primary dark:text-primary-fixed-dim flex items-center justify-center p-sm hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors rounded-full Active: scale-95 transition-transform duration-200">
<span aria-hidden="true">←</span>
</button>
<div class="w-10 h-10" aria-hidden="true"></div>
</header>
<!-- Main Content Canvas -->
<main class="min-h-[calc(100vh-140px)] px-margin-mobile pb-16">
<!-- Media Focus View (Asymmetric Layout) -->
<div class="mt-lg flex flex-col gap-lg">
<!-- Primary Image Card -->
<div class="relative w-full aspect-[4/5] rounded-xl overflow-hidden bg-surface-container-low group">
<img class="w-full h-full object-cover" data-alt="A warm and nostalgic high-quality photograph of a multi-generational family gathering around a weathered wooden table in a sun-drenched rustic dining room. The lighting is soft and golden, highlighting the textures of home-cooked food and the genuine smiles of elderly grandparents and young children. The color palette is composed of soft creams, sage greens, and warm earthy browns, reflecting a modern minimalist but tactile family atmosphere." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCFtdUkpTciADLo7Fcd0M2odBpoxEnfF2MBtQAsHCs48vcUrOlV58-vn2mkPi-7OrvH01r4Oh71F9F9-Fx9EXDs4w9qsGt_ryCxyKqm6QOCJLEJxL-9bzbzKO-n94m3Apf8A8HidEdS3hgWmTRYUvJXzCWiig5U66eX3x5s_wPyYJSx11V-cJye9zBF5CYxRaWU-3CCk3WSpGtEjOk_mI0VuyPGEf8A4kI9vpwF865v-ESzsXm5tEk1dqI2O2xzsQZK71PvP-MGT6M"/>
</div>
</div>
</main>
<!-- Success Toast Notification (User Requested) -->
<div class="fixed bottom-32 left-1/2 -translate-x-1/2 z-[60] w-[90%] max-w-sm">
<div class="bg-inverse-surface text-inverse-on-surface px-lg py-md rounded-xl flex items-center justify-center gap-sm animate-toast glass-effect">
<span class="font-label-sm text-label-sm">已成功保存到系统相册</span>
</div>
</div>
<nav aria-hidden="false" class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter pb-lg pt-sm bg-surface dark:bg-surface-dim rounded-t-xl" id="media-actions">
<button aria-label="下载" class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest active:scale-90 transition-all">
<span>下载</span>
</button>
<button aria-label="共享" class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest active:scale-90 transition-all">
<span>共享</span>
</button>
<button aria-label="删除" class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest active:scale-90 transition-all">
<span>删除</span>
</button>
</nav>
<script>
        function toggleMediaActions() {
            const actions = document.getElementById('media-actions');
            const toggle = document.getElementById('action-toggle');
            const icon = document.getElementById('action-toggle-icon');
            const isExpanded = toggle.getAttribute('aria-expanded') === 'true';

            toggle.setAttribute('aria-expanded', String(!isExpanded));
            toggle.setAttribute('aria-label', isExpanded ? '展开操作' : '收起操作');
            toggle.classList.toggle('bottom-lg', isExpanded);
            toggle.classList.toggle('bottom-24', !isExpanded);
            actions.setAttribute('aria-hidden', String(isExpanded));
            actions.classList.toggle('translate-y-full', isExpanded);
            actions.classList.toggle('translate-y-0', !isExpanded);
            actions.classList.toggle('opacity-0', isExpanded);
            actions.classList.toggle('opacity-100', !isExpanded);
            actions.classList.toggle('pointer-events-none', isExpanded);
            icon.textContent = isExpanded ? 'keyboard_arrow_up' : 'keyboard_arrow_down';
        }

        // Simple micro-interaction for toast disappearance
        document.addEventListener('DOMContentLoaded', () => {
            const toast = document.querySelector('.animate-toast').parentElement;
            setTimeout(() => {
                toast.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, 20px)';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        });

        // Interactive hover states for cards
        document.querySelectorAll('.aspect-[4/5]').forEach(card => {
            card.addEventListener('touchstart', () => {
                card.style.transform = 'scale(0.98)';
                card.style.transition = 'transform 0.2s ease';
            });
            card.addEventListener('touchend', () => {
                card.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
