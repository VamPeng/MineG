<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col overflow-hidden">

<div class="relative flex items-center justify-center">
<!-- Progress Ring Background -->
<svg class="w-24 h-24">
<circle class="text-white/20" cx="48" cy="48" fill="transparent" r="40" stroke="currentColor" stroke-width="4"></circle>
<circle class="text-primary-fixed-dim progress-ring-circle" cx="48" cy="48" fill="transparent" id="progress-circle" r="40" stroke="currentColor" stroke-dasharray="251.327" stroke-dashoffset="251.327" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<span class="text-white font-label-sm text-label-sm" id="progress-text">0%</span>
</div>
</div>

</div>
</div>

<script>
        function toggleMediaActions() {
            const actions = document.getElementById('media-actions');
            const toggle = document.getElementById('action-toggle');
            const icon = document.getElementById('action-toggle-icon');
            const isExpanded = toggle.getAttribute('aria-expanded') === 'true';

            toggle.setAttribute('aria-expanded', String(!isExpanded));
            toggle.setAttribute('aria-label', isExpanded ? '展开操作' : '收起操作');
            toggle.classList.toggle('bottom-lg', isExpanded);
            toggle.classList.toggle('bottom-24', !isExpanded);
            actions.setAttribute('aria-hidden', String(isExpanded));
            actions.classList.toggle('translate-y-full', isExpanded);
            actions.classList.toggle('translate-y-0', !isExpanded);
            actions.classList.toggle('opacity-0', isExpanded);
            actions.classList.toggle('opacity-100', !isExpanded);
            actions.classList.toggle('pointer-events-none', isExpanded);
            icon.textContent = isExpanded ? 'keyboard_arrow_up' : 'keyboard_arrow_down';
        }

        document.addEventListener('DOMContentLoaded', () => {
            const circle = document.getElementById('progress-circle');
            const progressText = document.getElementById('progress-text');
            const radius = circle.r.baseVal.value;
            const circumference = radius * 2 * Math.PI;

            circle.style.strokeDasharray = `${circumference} ${circumference}`;
            circle.style.strokeDashoffset = circumference;

            function setProgress(percent) {
                const offset = circumference - (percent / 100 * circumference);
                circle.style.strokeDashoffset = offset;
                progressText.innerText = `${Math.round(percent)}%`;
            }

            let currentProgress = 0;
            const interval = setInterval(() => {
                if (currentProgress >= 100) {
                    clearInterval(interval);
                    // Reset or transition logic could go here
                } else {
                    currentProgress += Math.random() * 5;
                    if (currentProgress > 100) currentProgress = 100;
                    setProgress(currentProgress);
                }
            }, 200);

            // Subtle parallax effect on media image
            const image = document.querySelector('main img');
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                image.style.transform = `scale(1.1) translate(${xAxis}px, ${yAxis}px)`;
            });
        });
    </script>
