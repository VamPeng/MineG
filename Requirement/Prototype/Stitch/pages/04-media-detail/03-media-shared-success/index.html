<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        .glass-effect {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        @keyframes toastIn {
            0% { transform: translate(-50%, 20px); opacity: 0; }
            100% { transform: translate(-50%, 0); opacity: 1; }
        }
        .toast-active {
            animation: toastIn 0.3s ease-out forwards;
        }
    </style>

<body class="bg-background text-on-background min-h-screen font-body-md overflow-x-hidden selection:bg-primary-fixed-dim selection:text-on-primary-fixed">
<!-- Top AppBar (from Shared Components JSON) -->

</div>
</div>
<main class="pb-16">
<!-- Hero Media Canvas -->

</div>
</main>
<nav aria-hidden="false" class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-gutter pb-lg pt-sm bg-surface dark:bg-surface-dim rounded-t-xl" id="media-actions">
<button aria-label="下载" class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest active:scale-90 transition-all">
<span>下载</span>
</button>
<button aria-label="共享" class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest active:scale-90 transition-all">
<span>共享</span>
</button>
<button aria-label="删除" class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container-highest active:scale-90 transition-all">
<span>删除</span>
</button>
</nav>
<script>
        function toggleMediaActions() {
            const actions = document.getElementById('media-actions');
            const toggle = document.getElementById('action-toggle');
            const icon = document.getElementById('action-toggle-icon');
            const isExpanded = toggle.getAttribute('aria-expanded') === 'true';

            toggle.setAttribute('aria-expanded', String(!isExpanded));
            toggle.setAttribute('aria-label', isExpanded ? '展开操作' : '收起操作');
            toggle.classList.toggle('bottom-lg', isExpanded);
            toggle.classList.toggle('bottom-24', !isExpanded);
            actions.setAttribute('aria-hidden', String(isExpanded));
            actions.classList.toggle('translate-y-full', isExpanded);
            actions.classList.toggle('translate-y-0', !isExpanded);
            actions.classList.toggle('opacity-0', isExpanded);
            actions.classList.toggle('opacity-100', !isExpanded);
            actions.classList.toggle('pointer-events-none', isExpanded);
            icon.textContent = isExpanded ? 'keyboard_arrow_up' : 'keyboard_arrow_down';
        }

        // Micro-interaction for the toast
        setTimeout(() => {
            const toast = document.getElementById('success-toast');
            toast.style.transition = 'opacity 0.5s ease-out, transform 0.5s ease-out';
            toast.style.opacity = '0';
            toast.style.transform = 'translate(-50%, -10px)';
            setTimeout(() => toast.remove(), 500);
        }, 3000);

    </script>
