<body class="min-h-screen flex flex-col font-body-md text-body-md">
<!-- Header Navigation (Simplified for Transactional Page) -->
<header class="w-full top-0 z-50 flex items-center justify-between px-margin-mobile py-md bg-surface">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-variant/20 active:scale-95 transition-all duration-200">
<span class="text-primary" aria-hidden="true">←</span>
</button>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary font-extrabold tracking-tight">MineG</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow relative overflow-hidden px-margin-mobile pt-xl pb-xl flex flex-col items-center">
<!-- Registration Content Canvas -->
<div class="w-full max-w-md">
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg border border-surface-container-highest/50">
<form class="space-y-md">
<!-- Phone Input -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-outline px-1" for="phone">手机号</label>
<div class="relative group">
<input class="w-full px-4 py-3 bg-surface-container-low border-transparent rounded-lg focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant" id="phone" placeholder="请输入手机号码" type="tel"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-outline px-1" for="password">设置密码</label>
<div class="relative group">
<input class="w-full px-4 py-3 bg-surface-container-low border-transparent rounded-lg focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant" id="password" placeholder="建议8位以上数字或字母" type="password"/>
</div>
</div>
<!-- Confirm Password Input -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-outline px-1" for="confirm-password">确认密码</label>
<div class="relative group">
<input class="w-full px-4 py-3 bg-surface-container-low border-transparent rounded-lg focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant" id="confirm-password" placeholder="请再次输入密码" type="password"/>
</div>
</div>
<p class="mt-md text-sm text-on-surface-variant">注册后需要审核。</p>
<!-- Submit Button -->
<button class="w-full mt-lg bg-primary text-on-primary font-headline-md py-4 rounded-lg active:scale-[0.98] transition-transform duration-200 flex items-center justify-center gap-sm" type="button">
<span>提交注册</span>
</button>
</form>
</div>
</div>
</main>
<!-- Interactive script for feedback -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('ring-2', 'ring-primary-fixed');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('ring-2', 'ring-primary-fixed');
            });
        });

        // Simple button click ripple effect simulation
        const btn = document.querySelector('button[type="button"]');
        btn.addEventListener('click', function(e) {
            let x = e.clientX - e.target.offsetLeft;
            let y = e.clientY - e.target.offsetTop;
            
            // Interaction feedback could be added here
            console.log("Registration submitted...");
        });
    </script>
