<!-- Phone Input -->

<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="smartphone">smartphone</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border-transparent rounded-lg focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant" id="phone" placeholder="请输入手机号码" type="tel"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-outline px-1" for="password">设置密码</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border-transparent rounded-lg focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant" id="password" placeholder="建议8位以上数字或字母" type="password"/>
</div>
</div>
<!-- Confirm Password Input -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-outline px-1" for="confirm-password">确认密码</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-outline group-focus-within:text-primary transition-colors" data-icon="verified_user">verified_user</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-low border-transparent rounded-lg focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline-variant" id="confirm-password" placeholder="请再次输入密码" type="password"/>
</div>
</div>

<div class="mt-lg p-md bg-secondary-container/10 rounded-lg flex items-start gap-sm">
<span class="material-symbols-outlined text-secondary mt-0.5 scale-75" data-icon="info">info</span>

            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('ring-2', 'ring-primary-fixed');
            });
        });

        // Simple button click ripple effect simulation
        const btn = document.querySelector('button[type="button"]');
