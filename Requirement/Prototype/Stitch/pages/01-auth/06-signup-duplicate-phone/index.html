<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MineG - 注册</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans:wght@400;500&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@100..900&family=Plus+Jakarta+Sans:wght@100..900&display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .hearth-glow {
            background: radial-gradient(circle at center, rgba(107, 142, 107, 0.15) 0%, rgba(255, 248, 244, 0) 70%);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-fixed-dim": "#c9c6c2",
                      "surface-variant": "#eae1da",
                      "primary-fixed": "#c6edc4",
                      "inverse-on-surface": "#f8efe8",
                      "on-secondary-fixed": "#360f00",
                      "on-primary-fixed": "#012108",
                      "surface-container-low": "#fbf2eb",
                      "surface-container-high": "#f0e7df",
                      "error": "#ba1a1a",
                      "on-primary": "#ffffff",
                      "surface-container-highest": "#eae1da",
                      "surface": "#fff8f4",
                      "on-surface-variant": "#424841",
                      "on-background": "#1f1b17",
                      "tertiary-fixed": "#e5e2dd",
                      "surface-container-lowest": "#ffffff",
                      "primary-fixed-dim": "#abd0a9",
                      "on-tertiary-fixed": "#1c1c19",
                      "surface-bright": "#fff8f4",
                      "secondary": "#914b2a",
                      "error-container": "#ffdad6",
                      "primary-container": "#5b7d5b",
                      "outline": "#737970",
                      "on-error-container": "#93000a",
                      "surface-tint": "#456646",
                      "tertiary-container": "#767471",
                      "primary": "#436444",
                      "tertiary": "#5d5c58",
                      "surface-dim": "#e1d8d2",
                      "outline-variant": "#c2c8be",
                      "on-secondary-container": "#773717",
                      "surface-container": "#f5ece5",
                      "on-tertiary": "#ffffff",
                      "on-error": "#ffffff",
                      "on-primary-fixed-variant": "#2e4e30",
                      "on-surface": "#1f1b17",
                      "inverse-primary": "#abd0a9",
                      "background": "#fff8f4",
                      "on-primary-container": "#f7fff2",
                      "on-tertiary-fixed-variant": "#474743",
                      "inverse-surface": "#34302b",
                      "secondary-container": "#fda27a",
                      "secondary-fixed-dim": "#ffb596",
                      "on-tertiary-container": "#fcffe3",
                      "on-secondary-fixed-variant": "#743415",
                      "secondary-fixed": "#ffdbcd",
                      "on-secondary": "#ffffff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-tablet": "32px",
                      "xs": "4px",

                      "lg": "24px",
                      "md": "16px",
                      "margin-mobile": "20px",
                      "xl": "40px",
                      "sm": "8px",
                      "gutter": "12px"
              },
              "fontFamily": {
                      "label-sm": ["Noto Sans"],
                      "display-lg-mobile": ["Plus Jakarta Sans"],

                      "headline-md": ["Plus Jakarta Sans"]
              },
              "fontSize": {

                      "body-lg": ["17px", {"lineHeight": "26px", "fontWeight": "400"}],
                      "body-md": ["15px", {"lineHeight": "22px", "fontWeight": "400"}],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface selection:bg-primary/20">
<!-- Top AppBar (Identity Anchor) -->
<header class="w-full top-0 z-50 bg-surface flex items-center justify-between px-margin-mobile py-md">
<button class="text-primary hover:bg-surface-variant/20 transition-colors p-2 rounded-full active:scale-95 duration-200">
<span aria-hidden="true">←</span>
</button>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">MineG</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile py-xl relative overflow-hidden">
<!-- Registration Card -->
<div class="w-full max-w-md glass-panel p-lg rounded-xl shadow-sm border border-surface-variant/30 flex flex-col gap-lg">
<div class="text-center">
<h2 class="font-headline-md text-headline-md-mobile text-on-surface">创建新账号</h2>
</div>
<!-- Form Container -->
<form class="flex flex-col gap-md" onsubmit="return false;">
<!-- Phone Number Input (Error State) -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="phone">手机号</label>
<div class="relative group">
<input aria-describedby="phone-error" aria-invalid="true" class="w-full px-4 py-4 bg-surface-container rounded-lg border-2 border-error outline-none transition-all duration-200 text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:ring-0" id="phone" placeholder="请输入手机号码" type="tel" value="13800138000"/>
</div>
<!-- Error Message -->
<div class="flex items-center gap-1 px-1 mt-1 animate-pulse" id="phone-error">
<p class="text-error font-label-sm text-label-sm">该手机号已注册</p>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="password">设置密码</label>
<div class="relative group">
<input class="w-full pl-4 pr-16 py-4 bg-surface-container rounded-lg border-2 border-transparent focus:border-primary outline-none transition-all duration-200 text-body-md font-body-md text-on-surface placeholder:text-outline-variant" id="password" placeholder="建议8位以上数字或字母" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-label-sm text-on-surface-variant hover:text-primary" type="button">
显示
</button>
</div>
</div>
<!-- Confirm Password Input -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="confirm-password">确认密码</label>
<div class="relative group">
<input class="w-full px-4 py-4 bg-surface-container rounded-lg border-2 border-transparent focus:border-primary outline-none transition-all duration-200 text-body-md font-body-md text-on-surface placeholder:text-outline-variant" id="confirm-password" placeholder="请再次输入密码" type="password"/>
</div>
</div>
<p class="mt-md text-sm text-on-surface-variant">注册后需要审核。</p>
<!-- Register Button -->
<button class="w-full py-4 mt-lg bg-primary text-on-primary font-headline-md text-headline-md-mobile rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200">
                    提交注册
                </button>
</form>
</div>
</main>
<script>
        // Simple micro-interaction for input fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
</body></html>
