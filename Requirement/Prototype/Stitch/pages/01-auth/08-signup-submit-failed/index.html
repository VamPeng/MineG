<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MineG - 注册页面</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#c9c6c2",
                    "surface-variant": "#eae1da",
                    "primary-fixed": "#c6edc4",
                    "inverse-on-surface": "#f8efe8",
                    "on-secondary-fixed": "#360f00",
                    "on-primary-fixed": "#012108",
                    "surface-container-low": "#fbf2eb",
                    "surface-container-high": "#f0e7df",
                    "error": "#ba1a1a",
                    "on-primary": "#ffffff",
                    "surface-container-highest": "#eae1da",
                    "surface": "#fff8f4",
                    "on-surface-variant": "#424841",
                    "on-background": "#1f1b17",
                    "tertiary-fixed": "#e5e2dd",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#abd0a9",
                    "on-tertiary-fixed": "#1c1c19",
                    "surface-bright": "#fff8f4",
                    "secondary": "#914b2a",
                    "error-container": "#ffdad6",
                    "primary-container": "#5b7d5b",
                    "outline": "#737970",
                    "on-error-container": "#93000a",
                    "surface-tint": "#456646",
                    "tertiary-container": "#767471",
                    "primary": "#436444",
                    "tertiary": "#5d5c58",
                    "surface-dim": "#e1d8d2",
                    "outline-variant": "#c2c8be",
                    "on-secondary-container": "#773717",
                    "surface-container": "#f5ece5",
                    "on-tertiary": "#ffffff",
                    "on-error": "#ffffff",
                    "on-primary-fixed-variant": "#2e4e30",
                    "on-surface": "#1f1b17",
                    "inverse-primary": "#abd0a9",
                    "background": "#fff8f4",
                    "on-primary-container": "#f7fff2",
                    "on-tertiary-fixed-variant": "#474743",
                    "inverse-surface": "#34302b",
                    "secondary-container": "#fda27a",
                    "secondary-fixed-dim": "#ffb596",
                    "on-tertiary-container": "#fcffe3",
                    "on-secondary-fixed-variant": "#743415",
                    "secondary-fixed": "#ffdbcd",
                    "on-secondary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-tablet": "32px",
                    "xs": "4px",
                    "unit": "4px",
                    "lg": "24px",
                    "md": "16px",
                    "margin-mobile": "20px",
                    "xl": "40px",
                    "sm": "8px",
                    "gutter": "12px"
            },
            "fontFamily": {
                    "label-sm": ["Noto Sans"],
                    "display-lg-mobile": ["Plus Jakarta Sans"],
                    "body-lg": ["Noto Sans"],
                    "body-md": ["Noto Sans"],
                    "display-lg": ["Plus Jakarta Sans"],
                    "headline-md": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "display-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "body-lg": ["17px", {"lineHeight": "26px", "fontWeight": "400"}],
                    "body-md": ["15px", {"lineHeight": "22px", "fontWeight": "400"}],
                    "display-lg": ["30px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            vertical-align: middle;
        }
        
        .error-banner-animation {
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDown {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        body {
            background-color: #fff8f4;
            background-image: radial-gradient(circle at 0% 0%, #fbf2eb 0%, transparent 50%),
                              radial-gradient(circle at 100% 100%, #eae1da 0%, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-on-background min-h-screen flex flex-col items-center">
<!-- Non-intrusive Error Banner -->
<div class="fixed top-0 left-0 w-full z-[100] px-margin-mobile pt-sm error-banner-animation">
<div class="max-w-md mx-auto bg-error-container text-on-error-container px-md py-sm rounded-xl shadow-lg flex items-center gap-sm border border-error/10">
<span class="font-label-sm text-label-sm flex-1">网络提交失败，请重试</span>
<button class="p-xs hover:bg-on-error-container/10 rounded-full transition-colors" onclick="this.parentElement.parentElement.remove()">
关闭
</button>
</div>
</div>
<!-- Header Section -->
<header class="w-full top-0 flex items-center justify-between px-margin-mobile py-md bg-surface/0">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-variant/20 transition-colors active:scale-95 duration-200">
<span class="text-primary" aria-hidden="true">←</span>
</button>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary tracking-tight">MineG</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content: Registration Flow -->
<main class="flex-1 w-full max-w-[480px] px-margin-mobile flex flex-col justify-center py-xl">
<div class="text-center mb-xl">
<h2 class="font-headline-md text-headline-md-mobile text-on-surface">创建新账号</h2>
</div>
<!-- Registration Form Card -->
<div class="glass-card rounded-xl p-lg border border-white shadow-sm space-y-lg">
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs" for="phone">手机号</label>
<div class="relative">
<input class="w-full px-md py-md bg-surface-container-low border-transparent focus:border-primary focus:ring-0 rounded-lg font-body-md transition-all outline-none" id="phone" placeholder="请输入手机号码" type="tel" value="13800138000"/>
</div>
</div>
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs" for="password">设置密码</label>
<div class="relative">
<input class="w-full px-md py-md bg-surface-container-low border-transparent focus:border-primary focus:ring-0 rounded-lg font-body-md transition-all outline-none" id="password" placeholder="建议8位以上数字或字母" type="password" value="Password123"/>
</div>
</div>
<div class="space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs" for="confirm-password">确认密码</label>
<div class="relative">
<input class="w-full px-md py-md bg-surface-container-low border-transparent focus:border-primary focus:ring-0 rounded-lg font-body-md transition-all outline-none" id="confirm-password" placeholder="请再次输入密码" type="password" value="Password123"/>
</div>
</div>
<p class="mt-md text-sm text-on-surface-variant">注册后需要审核。</p>
<div class="pt-md">
<button class="w-full bg-primary text-on-primary py-md rounded-lg font-headline-md text-headline-md-mobile shadow-md hover:brightness-110 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-sm">
<span>提交注册</span>
</button>
</div>
</div>
</main>
<script>
        // Micro-interaction for the registration button
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            const btn = this;
            const originalContent = btn.innerHTML;
            btn.disabled = true;
            btn.textContent = '正在连接…';
            
            // Simulating a retry attempt that could fail again or eventually succeed
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 2000);
        });
    </script>
</body></html>
