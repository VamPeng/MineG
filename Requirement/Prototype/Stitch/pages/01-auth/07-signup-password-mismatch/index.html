<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Noto+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#f5bd72",
                    "surface-variant": "#cddfe9",
                    "primary-fixed": "#d9f0ff",
                    "inverse-on-surface": "#eaf6ff",
                    "on-secondary-fixed": "#0c240d",
                    "on-primary-fixed": "#002f4a",
                    "surface-container-low": "#eef6fb",
                    "surface-container-high": "#d7e5ef",
                    "error": "#ba1a1a",
                    "on-primary": "#ffffff",
                    "surface-container-highest": "#cddfe9",
                    "surface": "#f7fbff",
                    "on-surface-variant": "#52616d",
                    "on-background": "#1b2730",
                    "tertiary-fixed": "#ffe0b2",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#b5e4ff",
                    "on-tertiary-fixed": "#2a1800",
                    "surface-bright": "#f7fbff",
                    "secondary": "#436444",
                    "error-container": "#ffdad6",
                    "primary-container": "#d9f0ff",
                    "outline": "#6f7e89",
                    "on-error-container": "#93000a",
                    "surface-tint": "#3baaff",
                    "tertiary-container": "#ffe0b2",
                    "primary": "#3baaff",
                    "tertiary": "#8a4f00",
                    "surface-dim": "#d7e5ef",
                    "outline-variant": "#c7d6e0",
                    "on-secondary-container": "#19331b",
                    "surface-container": "#e5f0f7",
                    "on-tertiary": "#ffffff",
                    "on-error": "#ffffff",
                    "on-primary-fixed-variant": "#004b73",
                    "on-surface": "#1b2730",
                    "inverse-primary": "#b5e4ff",
                    "background": "#f7fbff",
                    "on-primary-container": "#004b73",
                    "on-tertiary-fixed-variant": "#663c00",
                    "inverse-surface": "#26343f",
                    "secondary-container": "#dcebd9",
                    "secondary-fixed-dim": "#abd0a9",
                    "on-tertiary-container": "#3a2500",
                    "on-secondary-fixed-variant": "#2e4e30",
                    "secondary-fixed": "#dcebd9",
                    "on-secondary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-tablet": "32px",
                    "xs": "4px",
                    "unit": "4px",
                    "lg": "24px",
                    "md": "16px",
                    "margin-mobile": "20px",
                    "xl": "40px",
                    "sm": "8px",
                    "gutter": "12px"
            },
            "fontFamily": {
                    "label-sm": ["Noto Sans"],
                    "display-lg-mobile": ["Plus Jakarta Sans"],
                    "body-lg": ["Noto Sans"],
                    "body-md": ["Noto Sans"],
                    "display-lg": ["Plus Jakarta Sans"],
                    "headline-md": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "display-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "body-lg": ["17px", {"lineHeight": "26px", "fontWeight": "400"}],
                    "body-md": ["15px", {"lineHeight": "22px", "fontWeight": "400"}],
                    "display-lg": ["30px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #f7fbff;
            color: #1b2730;
            -webkit-font-smoothing: antialiased;
        }
        .digital-hearth-gradient {
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col font-body-md text-body-md digital-hearth-gradient">
<!-- Top Navigation Bar (Simplified for Auth Flow) -->
<header class="w-full top-0 flex items-center justify-between px-margin-mobile py-md bg-surface dark:bg-surface-dim z-50">
<div class="flex items-center gap-sm cursor-pointer active:scale-95 duration-200" onclick="history.back()">
<span class="text-primary dark:text-primary-fixed-dim" aria-hidden="true">←</span>
</div>
<div class="absolute left-1/2 -translate-x-1/2">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary dark:text-primary-fixed-dim">MineG</h1>
</div>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile py-xl">
<div class="w-full max-w-md">
<!-- Registration Form Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg border border-surface-variant/30">
<form class="space-y-lg" onsubmit="return false">
<!-- Phone Number -->
<div class="space-y-xs">
<label class="block font-label-sm text-label-sm text-on-surface-variant ml-xs" for="phone">手机号</label>
<div class="relative flex items-center">
<input class="w-full px-md py-md bg-surface-container rounded-lg border-none focus:ring-2 focus:ring-primary text-on-surface placeholder:text-outline-variant transition-all" id="phone" placeholder="请输入手机号码" type="tel" value="13800138000"/>
</div>
</div>
<!-- Password -->
<div class="space-y-xs">
<label class="block font-label-sm text-label-sm text-on-surface-variant ml-xs" for="password">设置密码</label>
<div class="relative flex items-center">
<input class="w-full px-md py-md bg-surface-container rounded-lg border-none focus:ring-2 focus:ring-primary text-on-surface transition-all" id="password" placeholder="建议8位以上数字或字母" type="password" value="Password123"/>
</div>
</div>
<!-- Confirm Password with Error State -->
<div class="space-y-xs">
<label class="block font-label-sm text-label-sm text-error ml-xs" for="confirm-password">确认密码</label>
<div class="relative flex items-center">
<input aria-describedby="password-error" aria-invalid="true" class="w-full px-md py-md bg-error-container/20 rounded-lg border-2 border-error focus:ring-2 focus:ring-error text-on-surface transition-all" id="confirm-password" placeholder="请再次输入密码" type="password" value="Password321"/>
</div>
<!-- Error Message -->
<div class="flex items-center gap-xs px-xs animate-shake" id="password-error">
<p class="font-label-sm text-label-sm text-error">两次密码不一致</p>
</div>
</div>
<p class="mt-md text-sm text-on-surface-variant">注册后需要审核。</p>
<!-- Submit Button -->
<button class="w-full bg-primary py-md rounded-lg text-on-primary font-headline-md text-headline-md-mobile active:scale-95 transition-transform duration-200 mt-md" type="submit">
                        提交注册
                    </button>
</form>
</div>
</div>
</main>
<script>
        // Simple shake animation for the error state
        const styleTag = document.createElement('style');
        styleTag.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-4px); }
                75% { transform: translateX(4px); }
            }
            .animate-shake {
                animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            }
        `;
        document.head.appendChild(styleTag);

        // Micro-interaction for input fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.previousElementSibling.classList.add('text-primary');
                input.parentElement.previousElementSibling.classList.remove('text-on-surface-variant');
            });
            input.addEventListener('blur', () => {
                input.parentElement.previousElementSibling.classList.remove('text-primary');
                input.parentElement.previousElementSibling.classList.add('text-on-surface-variant');
            });
        });
    </script>
</body></html>
