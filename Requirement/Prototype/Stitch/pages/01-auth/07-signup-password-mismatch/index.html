<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Noto+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed-dim": "#c9c6c2",
                    "surface-variant": "#eae1da",
                    "primary-fixed": "#c6edc4",
                    "inverse-on-surface": "#f8efe8",
                    "on-secondary-fixed": "#360f00",
                    "on-primary-fixed": "#012108",
                    "surface-container-low": "#fbf2eb",
                    "surface-container-high": "#f0e7df",
                    "error": "#ba1a1a",
                    "on-primary": "#ffffff",
                    "surface-container-highest": "#eae1da",
                    "surface": "#fff8f4",
                    "on-surface-variant": "#424841",
                    "on-background": "#1f1b17",
                    "tertiary-fixed": "#e5e2dd",
                    "surface-container-lowest": "#ffffff",
                    "primary-fixed-dim": "#abd0a9",
                    "on-tertiary-fixed": "#1c1c19",
                    "surface-bright": "#fff8f4",
                    "secondary": "#914b2a",
                    "error-container": "#ffdad6",
                    "primary-container": "#5b7d5b",
                    "outline": "#737970",
                    "on-error-container": "#93000a",
                    "surface-tint": "#456646",
                    "tertiary-container": "#767471",
                    "primary": "#436444",
                    "tertiary": "#5d5c58",
                    "surface-dim": "#e1d8d2",
                    "outline-variant": "#c2c8be",
                    "on-secondary-container": "#773717",
                    "surface-container": "#f5ece5",
                    "on-tertiary": "#ffffff",
                    "on-error": "#ffffff",
                    "on-primary-fixed-variant": "#2e4e30",
                    "on-surface": "#1f1b17",
                    "inverse-primary": "#abd0a9",
                    "background": "#fff8f4",
                    "on-primary-container": "#f7fff2",
                    "on-tertiary-fixed-variant": "#474743",
                    "inverse-surface": "#34302b",
                    "secondary-container": "#fda27a",
                    "secondary-fixed-dim": "#ffb596",
                    "on-tertiary-container": "#fcffe3",
                    "on-secondary-fixed-variant": "#743415",
                    "secondary-fixed": "#ffdbcd",
                    "on-secondary": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-tablet": "32px",
                    "xs": "4px",
                    "unit": "4px",
                    "lg": "24px",
                    "md": "16px",
                    "margin-mobile": "20px",
                    "xl": "40px",
                    "sm": "8px",
                    "gutter": "12px"
            },
            "fontFamily": {
                    "label-sm": ["Noto Sans"],
                    "display-lg-mobile": ["Plus Jakarta Sans"],
                    "body-lg": ["Noto Sans"],
                    "body-md": ["Noto Sans"],
                    "display-lg": ["Plus Jakarta Sans"],
                    "headline-md": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "display-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "body-lg": ["17px", {"lineHeight": "26px", "fontWeight": "400"}],
                    "body-md": ["15px", {"lineHeight": "22px", "fontWeight": "400"}],
                    "display-lg": ["30px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #fff8f4;
            color: #1f1b17;
            -webkit-font-smoothing: antialiased;
        }
        .digital-hearth-gradient {
            background: radial-gradient(circle at top right, rgba(107, 142, 107, 0.1), transparent 40%),
                        radial-gradient(circle at bottom left, rgba(145, 75, 42, 0.05), transparent 40%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col font-body-md text-body-md digital-hearth-gradient">
<!-- Top Navigation Bar (Simplified for Auth Flow) -->
<header class="w-full top-0 flex items-center justify-between px-margin-mobile py-md bg-surface dark:bg-surface-dim z-50">
<div class="flex items-center gap-sm cursor-pointer active:scale-95 duration-200" onclick="history.back()">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">arrow_back</span>
</div>
<div class="absolute left-1/2 -translate-x-1/2">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary dark:text-primary-fixed-dim">MineG</h1>
</div>
<div class="w-6"></div> <!-- Spacer for center alignment -->
</header>
<main class="flex-grow flex items-center justify-center px-margin-mobile py-xl">
<div class="w-full max-w-md">
<!-- Header Section -->
<div class="text-center mb-xl">
<h2 class="font-headline-md text-headline-md-mobile text-on-surface">创建新账号</h2>
</div>
<!-- Registration Form Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg shadow-sm border border-surface-variant/30">
<form class="space-y-lg" onsubmit="return false">
<!-- Phone Number -->
<div class="space-y-xs">
<label class="block font-label-sm text-label-sm text-on-surface-variant ml-xs" for="phone">手机号</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline">smartphone</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container rounded-lg border-none focus:ring-2 focus:ring-primary text-on-surface placeholder:text-outline-variant transition-all" id="phone" placeholder="请输入手机号码" type="tel" value="13800138000"/>
</div>
</div>
<!-- Password -->
<div class="space-y-xs">
<label class="block font-label-sm text-label-sm text-on-surface-variant ml-xs" for="password">设置密码</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline">lock</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container rounded-lg border-none focus:ring-2 focus:ring-primary text-on-surface transition-all" id="password" placeholder="建议8位以上数字或字母" type="password" value="Password123"/>
<span class="material-symbols-outlined absolute right-md text-outline-variant cursor-pointer">visibility</span>
</div>
</div>
<!-- Confirm Password with Error State -->
<div class="space-y-xs">
<label class="block font-label-sm text-label-sm text-error ml-xs" for="confirm-password">确认密码</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-error">lock_reset</span>
<input aria-describedby="password-error" aria-invalid="true" class="w-full pl-xl pr-md py-md bg-error-container/20 rounded-lg border-2 border-error focus:ring-2 focus:ring-error text-on-surface transition-all" id="confirm-password" placeholder="请再次输入密码" type="password" value="Password321"/>
<span class="material-symbols-outlined absolute right-md text-error/60 cursor-pointer">visibility</span>
</div>
<!-- Error Message -->
<div class="flex items-center gap-xs px-xs animate-shake" id="password-error">
<span class="material-symbols-outlined text-[14px] text-error" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-label-sm text-label-sm text-error">两次密码不一致</p>
</div>
</div>
<!-- Admin Review Notice -->
<div class="mt-lg p-md bg-secondary-container/10 rounded-lg flex items-start gap-sm">
<span class="material-symbols-outlined text-secondary mt-0.5 scale-75">info</span>
<p class="text-on-secondary-fixed-variant text-sm font-label-sm leading-relaxed">
                        注册后需要家庭管理员审核。审核通过后，您将获得访问家庭私有云空间的权限。
                    </p>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary py-md rounded-lg text-on-primary font-headline-md text-headline-md-mobile shadow-md active:scale-95 transition-transform duration-200 mt-md" type="submit">
                        提交注册
                    </button>
</form>
</div>
<!-- Bottom Navigation Link -->
<div class="mt-xl text-center">
<p class="text-on-surface-variant">
                    已有账号？ <a class="text-primary font-semibold hover:underline" href="#">直接登录</a>
</p>
</div>
</div>
</main>
<script>
        // Simple shake animation for the error state
        const styleTag = document.createElement('style');
        styleTag.innerHTML = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-4px); }
                75% { transform: translateX(4px); }
            }
            .animate-shake {
                animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
            }
        `;
        document.head.appendChild(styleTag);

        // Micro-interaction for input fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.previousElementSibling.classList.add('text-primary');
                input.parentElement.previousElementSibling.classList.remove('text-on-surface-variant');
            });
            input.addEventListener('blur', () => {
                input.parentElement.previousElementSibling.classList.remove('text-primary');
                input.parentElement.previousElementSibling.classList.add('text-on-surface-variant');
            });
        });
    </script>
</body></html>
