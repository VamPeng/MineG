<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MineG - 登录</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        theme: {
          extend: {
            "colors": {
                    "surface-container-highest": "#eae1da",
                    "surface-tint": "#456646",
                    "on-secondary-fixed-variant": "#743415",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#fbf2eb",
                    "tertiary-container": "#767471",
                    "surface": "#fff8f4",
                    "surface-bright": "#fff8f4",
                    "primary": "#436444",
                    "on-background": "#1f1b17",
                    "secondary-fixed": "#ffdbcd",
                    "on-surface": "#1f1b17",
                    "surface-variant": "#eae1da",
                    "surface-container": "#f5ece5",
                    "surface-container-lowest": "#ffffff",
                    "outline-variant": "#c2c8be",
                    "on-secondary-container": "#773717",
                    "secondary-fixed-dim": "#ffb596",
                    "tertiary-fixed-dim": "#c9c6c2",
                    "tertiary": "#5d5c58",
                    "background": "#fff8f4",
                    "surface-dim": "#e1d8d2",
                    "on-error": "#ffffff",
                    "secondary-container": "#fda27a",
                    "on-primary-container": "#f7fff2",
                    "on-tertiary-fixed": "#1c1c19",
                    "primary-fixed": "#c6edc4",
                    "inverse-primary": "#abd0a9",
                    "on-primary-fixed": "#012108",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed-variant": "#2e4e30",
                    "on-primary": "#ffffff",
                    "inverse-on-surface": "#f8efe8",
                    "surface-container-high": "#f0e7df",
                    "primary-fixed-dim": "#abd0a9",
                    "outline": "#737970",
                    "inverse-surface": "#34302b",
                    "on-tertiary-fixed-variant": "#474743",
                    "error": "#ba1a1a",
                    "tertiary-fixed": "#e5e2dd",
                    "secondary": "#914b2a",
                    "error-container": "#ffdad6",
                    "on-tertiary-container": "#fcffe3",
                    "on-surface-variant": "#424841",
                    "on-secondary-fixed": "#360f00",

            "borderRadius": {

            },
            "fontFamily": {

                    "headline-md": ["Plus Jakarta Sans"],

                    "body-lg": ["Noto Sans SC"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "display-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "display-lg": ["30px", {"lineHeight": "40px", "fontWeight": "700"}],

          },

      }

<style>
        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #fff8f4;
            color: #1f1b17;
            height: 800px;
            width: 360px;
            margin: 0 auto;
            overflow: hidden;
            position: relative;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .network-banner-slide {
            animation: slideDown 0.4s ease-out forwards;
        }
        @keyframes slideDown {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }
        .pulse-soft {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col">
<!-- Top Status Bar (System Style) -->
<div class="h-8 w-full flex items-center justify-between px-4 text-xs font-medium text-on-surface-variant">
<span>10:30</span>
<div class="flex gap-1 items-center">
<span class="material-symbols-outlined text-[14px]">signal_cellular_connected_no_internet_4_bar</span>
<span class="material-symbols-outlined text-[14px]">battery_alert</span>
</div>
</div>
<!-- Network Warning Banner -->
<div class="network-banner-slide bg-surface-container-highest/90 backdrop-blur-sm px-margin-mobile py-3 flex items-center gap-3 z-50">
<span class="material-symbols-outlined text-secondary text-[20px] pulse-soft">cloud_off</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">网络连接不可用，请检查网络设置</span>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile pt-12 relative overflow-hidden">
<!-- Branding Header -->
<header class="mb-12">
<div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center mb-6 shadow-sm">
<span class="material-symbols-outlined text-white text-[32px]" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-tight">欢迎回来</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">登录您的 MineG 私人家庭云存储</p>
</header>
<!-- Login Form -->
<div class="space-y-6">
<!-- Account Input -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-primary ml-1">账号</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">person</span>
</div>
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 pl-11 pr-4 font-body-md text-body-md focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline-variant" placeholder="请输入手机号或邮箱" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-primary ml-1">密码</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 pl-11 pr-4 font-body-md text-body-md focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline-variant" placeholder="请输入您的登录密码" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center">
<span class="material-symbols-outlined text-outline text-[20px] cursor-pointer">visibility_off</span>
</div>
</div>
</div>
<!-- Login Button (Disabled State) -->
<button class="w-full bg-outline-variant text-white font-headline-md text-headline-md py-4 rounded-xl shadow-none opacity-60 flex items-center justify-center gap-2 mt-8 cursor-not-allowed" disabled="">
<span>登录</span>
</button>
<!-- Bottom Actions -->
<div class="flex justify-center pt-4">
<button class="font-label-sm text-label-sm text-secondary-container bg-secondary/10 px-4 py-2 rounded-full font-medium">
                    还没有账号？立即注册
                </button>
</div>
</div>
<!-- Visual Background Decoration (Subtle) -->
<div class="absolute -bottom-16 -right-16 w-64 h-64 bg-primary-fixed-dim/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -top-16 -left-16 w-48 h-48 bg-secondary-fixed/20 rounded-full blur-3xl pointer-events-none"></div>
<!-- Privacy Assurance -->
<footer class="mt-auto pb-8 text-center">
<div class="flex items-center justify-center gap-1.5 text-outline mb-1">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-label-sm text-label-sm">端到端加密保护您的家庭回忆</span>
</div>
<p class="font-label-sm text-label-sm text-outline-variant scale-90">登录即代表您同意《服务协议》与《隐私政策》</p>
</footer>
</main>
<!-- Interactive script for demo -->
<script>
        // Simple visual feedback for interaction attempts while offline
        document.querySelectorAll('input, button').forEach(el => {
            el.addEventListener('click', (e) => {
                if (el.disabled || el.tagName === 'INPUT') {
                    const banner = document.querySelector('.network-banner-slide');
                    banner.classList.remove('pulse-soft');
                    void banner.offsetWidth; // Trigger reflow
                    banner.classList.add('pulse-soft');
                    banner.style.backgroundColor = '#fae1cc'; // Brief flash highlight
                    setTimeout(() => {
                        banner.style.backgroundColor = 'rgba(234, 225, 218, 0.9)';
                    }, 500);
                }
            });
        });
    </script>
</body></html>
