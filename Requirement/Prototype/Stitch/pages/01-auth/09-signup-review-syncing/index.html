<style>
        @keyframes pulse-slow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-pulse-slow { animation: pulse-slow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .animate-float { animation: float 6s ease-in-out infinite; }
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md text-body-md min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 z-50 bg-surface dark:bg-surface-dim flex items-center justify-between px-margin-mobile py-md">
<div class="flex items-center gap-md">
<button aria-label="返回" class="text-primary dark:text-primary-fixed-dim hover:bg-surface-variant/20 transition-colors p-2 rounded-full active:scale-95 duration-200" onclick="history.back()">←</button>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary dark:text-primary-fixed-dim tracking-tight">MineG</h1>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content -->
<main class="flex-1 flex items-center justify-center px-margin-mobile py-xl">
<section class="w-full max-w-sm text-center">
<h2 class="font-headline-md text-headline-md-mobile text-on-surface">注册申请待审核</h2>
<p class="mt-sm text-on-surface-variant">审核通过后即可使用 MineG。</p>
<div class="mt-xl space-y-md">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-bold active:scale-95 transition-all shadow-sm" id="refreshBtn">
                    刷新状态
                </button>
<button class="w-full py-3 text-on-surface-variant font-medium active:scale-95 transition-all">
                    退出当前账号
                </button>
</div>
</section>
</main>
<script>
        const refreshBtn = document.getElementById('refreshBtn');

        refreshBtn.addEventListener('click', () => {
            refreshBtn.classList.add('opacity-80', 'pointer-events-none');
            refreshBtn.textContent = '正在刷新…';
            setTimeout(() => {
                refreshBtn.classList.remove('opacity-80', 'pointer-events-none');
                refreshBtn.textContent = '刷新状态';
            }, 1500);
        });
    </script>
</body></html>
