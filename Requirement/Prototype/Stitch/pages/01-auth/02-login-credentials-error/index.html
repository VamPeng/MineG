<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-highest": "#eae1da",
                    "surface-tint": "#456646",
                    "on-secondary-fixed-variant": "#743415",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#fbf2eb",
                    "tertiary-container": "#767471",
                    "surface": "#fff8f4",
                    "surface-bright": "#fff8f4",
                    "primary": "#436444",
                    "on-background": "#1f1b17",
                    "secondary-fixed": "#ffdbcd",
                    "on-surface": "#1f1b17",
                    "surface-variant": "#eae1da",
                    "surface-container": "#f5ece5",
                    "surface-container-lowest": "#ffffff",
                    "outline-variant": "#c2c8be",
                    "on-secondary-container": "#773717",
                    "secondary-fixed-dim": "#ffb596",
                    "tertiary-fixed-dim": "#c9c6c2",
                    "tertiary": "#5d5c58",
                    "background": "#fff8f4",
                    "surface-dim": "#e1d8d2",
                    "on-error": "#ffffff",
                    "secondary-container": "#fda27a",
                    "on-primary-container": "#f7fff2",
                    "on-tertiary-fixed": "#1c1c19",
                    "primary-fixed": "#c6edc4",
                    "inverse-primary": "#abd0a9",
                    "on-primary-fixed": "#012108",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed-variant": "#2e4e30",
                    "on-primary": "#ffffff",
                    "inverse-on-surface": "#f8efe8",
                    "surface-container-high": "#f0e7df",
                    "primary-fixed-dim": "#abd0a9",
                    "outline": "#737970",
                    "inverse-surface": "#34302b",
                    "on-tertiary-fixed-variant": "#474743",
                    "error": "#ba1a1a",
                    "tertiary-fixed": "#e5e2dd",
                    "secondary": "#914b2a",
                    "error-container": "#ffdad6",
                    "on-tertiary-container": "#fcffe3",
                    "on-surface-variant": "#424841",
                    "on-secondary-fixed": "#360f00",
                    "on-tertiary": "#ffffff",
                    "primary-container": "#5b7d5b"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-tablet": "32px",
                    "sm": "8px",
                    "md": "16px",
                    "lg": "24px",
                    "xs": "4px",
                    "xl": "40px",
                    "margin-mobile": "20px",
                    "unit": "4px",
                    "gutter": "12px"
            },
            "fontFamily": {
                    "label-sm": ["Noto Sans SC"],
                    "display-lg-mobile": ["Plus Jakarta Sans"],
                    "display-lg": ["Plus Jakarta Sans"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "body-md": ["Noto Sans SC"],
                    "body-lg": ["Noto Sans SC"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}],
                    "display-lg-mobile": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "display-lg": ["30px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-md": ["15px", {"lineHeight": "22px", "fontWeight": "400"}],
                    "body-lg": ["17px", {"lineHeight": "26px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #fff8f4;
            color: #1f1b17;
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .error-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen items-center justify-center bg-background p-margin-mobile">
<!-- Login Shell Canvas (360x800 logic) -->
<main class="w-full max-w-[360px] h-full flex flex-col justify-between animate-fade-in">
<!-- Top Anchor: Brand & Message -->
<header class="pt-xl mb-xl">
<div class="flex items-center gap-sm mb-lg">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">shield_person</span>
<h1 class="font-headline-md text-headline-md-mobile text-primary tracking-tight">MineG</h1>
</div>
<h2 class="font-display-lg-mobile text-display-lg-mobile text-on-surface">欢迎回来</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs">私密、温暖的家庭数字空间</p>
</header>
<!-- Input Section -->
<section class="flex-grow space-y-md">
<!-- Username/Phone Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs">手机号码</label>
<div class="relative group">
<input class="w-full bg-surface-container-low border-2 border-error text-on-surface rounded-xl px-md py-md font-body-lg text-body-lg focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline-variant" placeholder="请输入手机号" type="text" value="13800138000"/>
<div class="absolute right-md top-1/2 -translate-y-1/2">
<span class="material-symbols-outlined text-error text-[20px]">error</span>
</div>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-xs">登录密码</label>
<div class="relative group">
<input class="w-full bg-surface-container-low border-2 border-error text-on-surface rounded-xl px-md py-md font-body-lg text-body-lg focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all placeholder:text-outline-variant" placeholder="请输入密码" type="password" value="••••••••"/>
<div class="absolute right-md top-1/2 -translate-y-1/2">
<span class="material-symbols-outlined text-outline text-[20px]">visibility_off</span>
</div>
</div>
<!-- Error Message -->
<div class="flex items-center gap-xs px-xs pt-xs error-shake">
<span class="material-symbols-outlined text-error text-[16px]">report</span>
<p class="font-label-sm text-label-sm text-error">手机号或密码错误</p>
</div>
</div>
</section>
<!-- Action Section -->
<footer class="mt-xl pb-margin-mobile">
<button class="w-full bg-primary text-on-primary py-md rounded-xl font-headline-md text-headline-md-mobile shadow-lg active:scale-[0.98] transition-transform flex items-center justify-center gap-sm">
<span>立即登录</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<div class="mt-lg flex flex-col items-center gap-sm">
<p class="font-label-sm text-label-sm text-on-surface-variant">
                    还没有账号？<span class="text-primary font-bold ml-xs">联系家人加入</span>
</p>
</div>
</footer>
</main>
<!-- Decorative Hearth Glow (Minimalist Background Element) -->
<div class="fixed top-[-10%] right-[-20%] w-[300px] h-[300px] bg-secondary-container/10 rounded-full blur-[100px] -z-10"></div>
<div class="fixed bottom-[-5%] left-[-10%] w-[250px] h-[250px] bg-primary-container/10 rounded-full blur-[80px] -z-10"></div>
<script>
        // Simple micro-interaction for button press
        const loginBtn = document.querySelector('button');
        loginBtn.addEventListener('click', () => {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.classList.remove('error-shake');
                void input.offsetWidth; // trigger reflow
                input.classList.add('error-shake');
            });
            
            const errorMsg = document.querySelector('.error-shake');
            errorMsg.classList.remove('error-shake');
            void errorMsg.offsetWidth; 
            errorMsg.classList.add('error-shake');
        });
    </script>
</body></html>
