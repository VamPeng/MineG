<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=360, height=800, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>

                    "secondary-fixed": "#dcebd9",
                    "on-surface": "#1b2730",
                    "surface-variant": "#cddfe9",
                    "surface-container": "#e5f0f7",
                    "surface-container-lowest": "#ffffff",
                    "outline-variant": "#c7d6e0",
                    "on-secondary-container": "#19331b",
                    "secondary-fixed-dim": "#abd0a9",
                    "tertiary-fixed-dim": "#f5bd72",
                    "tertiary": "#8a4f00",
                    "background": "#f7fbff",
                    "surface-dim": "#d7e5ef",
                    "on-error": "#ffffff",
                    "secondary-container": "#dcebd9",
                    "on-primary-container": "#004b73",
                    "on-tertiary-fixed": "#2a1800",
                    "primary-fixed": "#d9f0ff",
                    "inverse-primary": "#b5e4ff",
                    "on-primary-fixed": "#002f4a",
                    "on-secondary": "#ffffff",
                    "on-primary-fixed-variant": "#004b73",
                    "on-primary": "#ffffff",
                    "inverse-on-surface": "#eaf6ff",
                    "surface-container-high": "#d7e5ef",
                    "primary-fixed-dim": "#b5e4ff",
                    "outline": "#6f7e89",
                    "inverse-surface": "#26343f",
                    "on-tertiary-fixed-variant": "#663c00",
                    "error": "#ba1a1a",
                    "tertiary-fixed": "#ffe0b2",
                    "secondary": "#436444",
                    "error-container": "#ffdad6",
                    "on-tertiary-container": "#3a2500",
                    "on-surface-variant": "#52616d",
                    "on-secondary-fixed": "#0c240d",

<style>
        body {
            background-color: #f7fbff;
            color: #1b2730;
            font-family: 'Noto Sans', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(59, 170, 255, 0.32);
        }
        .fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .error-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between py-12 px-margin-mobile">
<!-- Brand Header -->
<header class="w-full flex flex-col items-center space-y-4 fade-in mt-8">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary font-extrabold tracking-tight">MineG</h1>
</header>
<!-- Login Form -->
<main class="w-full flex flex-col space-y-6 fade-in" style="animation-delay: 0.1s;">
<div class="space-y-4">
<!-- Phone Number Input -->
<div class="relative group">
<input aria-describedby="credentials-error" aria-invalid="true" class="w-full h-14 px-4 bg-surface-container-low border border-error rounded-xl font-body-md text-body-md placeholder:text-outline/60 focus:ring-2 focus:ring-error transition-all" placeholder="请输入手机号" type="tel" value="13800138000"/>
</div>
<!-- Password Input -->
<div class="relative group">
<input aria-describedby="credentials-error" aria-invalid="true" class="w-full h-14 pl-4 pr-16 bg-surface-container-low border border-error rounded-xl font-body-md text-body-md placeholder:text-outline/60 focus:ring-2 focus:ring-error transition-all" placeholder="请输入密码" type="password" value="12345678"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-label-sm text-outline hover:text-primary transition-colors" type="button">
显示
</button>
</div>
<!-- Error Message -->
<div class="flex items-center space-x-1 px-1 text-error error-shake" id="credentials-error">
<p class="font-label-sm text-label-sm text-error">手机号或密码错误</p>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-primary text-on-primary font-headline-md text-headline-md-mobile rounded-xl active:scale-[0.98] transition-transform flex items-center justify-center">
            登录
</button>
<!-- Secondary Action -->
<div class="text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                还没有账号？<a class="text-primary font-semibold hover:underline" href="../04-signup-admin-review-notice/index.html">立即注册</a>
</p>
</div>
</main>
<script>
        // Simple micro-interaction for password visibility
        const toggleBtn = document.querySelector('button[type="button"]');
        const passInput = document.querySelector('input[type="password"]');
        let visible = false;

        toggleBtn.addEventListener('click', () => {
            visible = !visible;
            passInput.type = visible ? 'text' : 'password';
            toggleBtn.textContent = visible ? '隐藏' : '显示';
        });

        // Keep the error state visible when login is retried
        const loginBtn = document.querySelector('button.bg-primary');
        loginBtn.addEventListener('click', () => {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.classList.remove('error-shake');
                void input.offsetWidth; // trigger reflow
                input.classList.add('error-shake');
            });
            const errorMsg = document.getElementById('credentials-error');
            errorMsg.classList.remove('error-shake');
            void errorMsg.offsetWidth;
            errorMsg.classList.add('error-shake');
        });
    </script>
</body></html>
