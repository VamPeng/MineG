    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-surface font-body-md antialiased min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="w-full top-0 z-50 flex items-center justify-between px-margin-mobile py-md w-full bg-surface">
<div class="flex items-center gap-md">
<button class="hover:bg-surface-variant/20 transition-colors p-sm rounded-full active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary">MineG</h1>
</div>
<div class="w-10"></div> <!-- Spacer for center-alignment if needed -->
</header>
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile relative overflow-hidden">
<!-- Atmospheric Background Element -->
<div class="absolute inset-0 pointer-events-none">

</div>
<!-- Central Calm Graphic Section -->
<div class="relative z-10 w-full max-w-md flex flex-col items-center">
<div class="relative w-64 h-64 mb-xl flex items-center justify-center">
<!-- Decorative Rings -->
<div class="absolute inset-0 border-2 border-primary/10 rounded-full animate-soft-pulse"></div>
<div class="absolute inset-4 border border-secondary-container/30 rounded-full" style="animation: soft-pulse 5s ease-in-out infinite reverse;"></div>
<!-- Center Icon/Image Container -->
<div class="w-48 h-48 rounded-full overflow-hidden shadow-lg border-4 border-surface-container-highest">
<img class="w-full h-full object-cover" data-alt="A serene and minimalist illustration of a digital hearth, featuring soft glowing embers in a sage green and warm cream environment. The style is modern tactile with clean lines and a sense of domestic tranquility. Lighting is warm and diffused, creating a safe and private atmosphere for a family cloud storage service." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBFrk11KBL2sS-iZ7bgFyXPnAfTvR08KRHqaouxGImrkEvy5lvSMsi_Gb-NJ0JdBlFlGZs0w-804x39R74Ltq0pUnz3kBHKqZF65ldGMoDGyDrR9qa4KNSmMcNxZbYGhKjM8-brvBLj6Bc2G_yu0gKnlnIchXsVLgmXIF6qIIguBGcnK4cOCVuYFg-K3pK0_ZMPhUcb_Aw1HzZhSzKiQSBRK0nRnB3pxeBs27hFrc5KJSrpEgcELQ2ULstadNqVe1SIw_mf5m4XLvk"/>
</div>
<!-- Floating Status Badge -->
<div class="absolute bottom-4 right-4 glass-panel px-md py-sm rounded-xl shadow-sm border border-outline-variant/30 flex items-center gap-xs">
<span class="material-symbols-outlined text-secondary text-[18px]" style="font-variation-settings: 'FILL' 1;">hourglass_top</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">待审核</span>
</div>
</div>
<!-- Text Content -->
<div class="text-center space-y-md">
<h2 class="font-headline-md text-headline-md-mobile text-on-surface tracking-tight">注册申请正在审核</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
                    家庭管理员通过后，你就可以使用 MineG 存储珍贵的家庭记忆。
                </p>
</div>
</div>
</main>
<!-- Bottom Actions Layer (Scheme 2: Emphasizing Re-login Confirmation) -->
<footer class="p-xl bg-surface-container-low/50 backdrop-blur-sm rounded-t-[2rem] border-t border-outline-variant/10">
<div class="max-w-md mx-auto flex flex-col gap-md">
<!-- Primary Action: Re-login to effect -->
<button class="w-full py-4 px-lg bg-primary text-on-primary rounded-xl font-headline-md text-headline-md-mobile shadow-md active:scale-[0.98] transition-all hover:bg-primary-container flex items-center justify-center gap-md" onclick="handleReload()">
<span class="material-symbols-outlined" data-icon="refresh">refresh</span>
                重新登录后生效
            </button>
<!-- Secondary Action: Logout -->
<button class="w-full py-md text-secondary font-label-sm text-label-sm hover:underline active:opacity-70 transition-opacity flex items-center justify-center gap-xs" onclick="handleLogout()">
<span class="material-symbols-outlined text-[20px]" data-icon="logout">logout</span>
                退出当前账号
            </button>
</div>
<!-- Safety Disclaimer -->
<div class="mt-lg text-center">
<p class="text-[10px] text-outline uppercase tracking-widest flex items-center justify-center gap-1">
<span class="material-symbols-outlined text-[12px]" style="font-variation-settings: 'FILL' 1;">shield</span>
                您的数据安全由 MineG 隐私协议保护
            </p>
</div>
</footer>
<script>
        function handleReload() {
            // Visual feedback for interaction
            const btn = event.currentTarget;
            btn.classList.add('opacity-80');
            const icon = btn.querySelector('.material-symbols-outlined');
            icon.style.transition = 'transform 0.6s ease';
            icon.style.transform = 'rotate(360deg)';
            
            setTimeout(() => {
                alert('正在刷新审核状态...');
                btn.classList.remove('opacity-80');
                icon.style.transform = 'rotate(0deg)';
            }, 600);
        }

        function handleLogout() {
            if(confirm('确定要退出当前账号吗？')) {
                console.log('User logging out...');
            }
        }

        // Simple mouse tracking for a subtle parallax effect on the central graphic
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            const graphic = document.querySelector('.relative.w-64.h-64');
            if (graphic) {
                graphic.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });
    </script>
