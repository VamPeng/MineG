<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        body {
            background-color: #fff8f4;
            color: #1f1b17;
            -webkit-font-smoothing: antialiased;
        }
        .tonal-layer {
            background: linear-gradient(180deg, rgba(255,248,244,0) 0%, rgba(245,236,229,1) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface-dim shadow-sm z-50 flex items-center justify-between px-margin-mobile py-sm">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim" data-icon="lock">lock</span>
<h1 class="font-headline-md text-headline-md-mobile text-primary dark:text-primary-fixed-dim tracking-tight">MineG</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-on-surface-variant dark:text-outline" data-icon="cloud_done">cloud_done</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile text-center py-xl relative overflow-hidden">
<!-- Background Atmospheric Element -->
<div class="absolute inset-0 -z-10 opacity-30 pointer-events-none">

</div>
<!-- Restriction Card -->
<div class="bg-surface-container-lowest p-lg rounded-xl shadow-[0_12px_40px_-12px_rgba(0,0,0,0.05)] max-w-sm w-full border border-surface-variant">
<div class="mb-lg">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-error-container text-on-error-container mb-md">
<span class="material-symbols-outlined text-[32px]" data-icon="admin_panel_settings">admin_panel_settings</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-sm">访问受限</h2>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                    受系统功能限制，MineG 目前无法访问您的相册。请检查设备的访问限制设置或联系管理员。
                </p>
</div>
<!-- Action Area -->
<div class="space-y-sm">
<button class="w-full py-3 px-md bg-primary text-on-primary font-label-sm text-label-sm rounded-lg hover:bg-primary-container active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
                    前往系统设置
                </button>
<button class="w-full py-3 px-md border border-outline text-outline font-label-sm text-label-sm rounded-lg hover:bg-surface-container-high active:scale-95 transition-all">
                    了解更多
                </button>
</div>
<!-- Policy Footer -->
<div class="mt-xl pt-md border-t border-surface-variant flex items-center justify-center gap-2 text-outline">
<span class="material-symbols-outlined text-sm" data-icon="security" style="font-size: 14px;">security</span>
<span class="font-label-sm text-[10px] uppercase tracking-wider">Enterprise Security Policy</span>
</div>
</div>
<!-- Decorative Image Context (Asymmetric Layout Hint) -->
<div class="mt-xl grid grid-cols-2 gap-sm opacity-40 grayscale pointer-events-none">
<div class="w-24 h-24 rounded-lg bg-surface-container-highest overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A blurred, minimalist black and white photograph of a family walking in a sunlit forest, emphasizing a nostalgic and private atmosphere. The lighting is soft and diffused, matching the warm cream and sage green UI palette. Minimalist and modern aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqPu0Pxxpj9ercpW8WudBWcD-lOHbt2ILq0QJ6dQBrWTj4qGC_1atlSKNMv30W8PSrSk9k0Y8auUo_FbYNjVoo5ZeHubCeFZ1xmXrrIgn2-H_EWJUysckNFWBbRn0LRP4WB_rLWjb_vhRrUR364gXT9lJxLjP-5D6QioPFmJL0ZL5OO3GFxTpFUi8l2mTRgfOJ4exmR-gf3qqmWoa5hVsnyw3C2KYuZrqdRmzMuC2dUN7SSQgrZqIotES15rZt-QeCSTyQFbxXb54"/>
</div>
<div class="w-24 h-24 rounded-lg bg-surface-container-highest overflow-hidden mt-sm">
<img class="w-full h-full object-cover" data-alt="A soft-focus architectural detail of a modern, warm wooden home interior. Sunlight creates clean lines and shadows on a cream-colored wall. The image conveys safety, stability, and the feeling of a digital hearth, aligning with the secure cloud storage theme." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCBssz4JhKZWCQXU2DpRkdjB_EwKimh9G1O7SPNy65MAQ3xEoPzVo3HnFMyFPLE5jtoVYMOWfGQ7tAXuH5SocxZA3SIinrjgK__RDmQupmke9y2aBE7Xz6_it1fwjZwqk9yGRvWARjz3mu42qOHrnSvBCtWLfIhAs6MQo1QN0EIq3zRxP8BpQ0sFwIAQ5b2PNNbMfUAKewcJ84LbEtMAVZ91Z8AEPwwBbsF5nFZATXos12pXGV_Ss1H9Gfkaxn7Ot_ROZCW0vWZ2Cw"/>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-sm pb-6 pt-2 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md shadow-[0_-2px_12px_rgba(0,0,0,0.05)]">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-3 py-1 hover:bg-surface-container-low active:scale-90 transition-all duration-150">
<span class="material-symbols-outlined" data-icon="shield_person">shield_person</span>
<span class="font-label-sm text-label-sm">私人空间</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-xl px-3 py-1 active:scale-90 transition-all duration-150">
<span class="material-symbols-outlined" data-icon="photo_library" style="font-variation-settings: 'FILL' 1;">photo_library</span>
<span class="font-label-sm text-label-sm">家庭相册</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-3 py-1 hover:bg-surface-container-low active:scale-90 transition-all duration-150">
<span class="material-symbols-outlined" data-icon="cloud_upload">cloud_upload</span>
<span class="font-label-sm text-label-sm">备份</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-3 py-1 hover:bg-surface-container-low active:scale-90 transition-all duration-150">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
<span class="font-label-sm text-label-sm">回收站</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-3 py-1 hover:bg-surface-container-low active:scale-90 transition-all duration-150">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">我的</span>
</button>
</nav>
<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transform = 'scale(0.96)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });
            button.addEventListener('mouseleave', () => {
                button.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
