<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>MineG - 权限访问受阻</title>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- TopAppBar -->
<header class="w-full top-0 sticky z-50 bg-surface shadow-sm flex items-center justify-between px-margin-mobile py-sm">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" data-icon="lock">lock</span>
<h1 class="font-headline-md text-headline-md-mobile text-primary tracking-tight">MineG</h1>
</div>
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="cloud_done">cloud_done</span>
</div>
</header>
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile pb-32 pt-8">
<!-- Error State Illustration Area -->
<div class="relative w-full max-w-sm aspect-square mb-lg flex items-center justify-center">
<div class="absolute inset-0 bg-secondary-fixed opacity-10 rounded-full scale-90 blur-3xl animate-pulse"></div>
<!-- Asymmetric Glassmorphism Card for Empty State -->
<div class="glass-panel p-xl rounded-xl border border-surface-container-highest shadow-lg relative overflow-hidden flex flex-col items-center text-center">
<div class="w-20 h-20 rounded-full bg-error-container flex items-center justify-center mb-md">
<span class="material-symbols-outlined text-error text-[40px]" data-icon="photo_library">photo_library</span>
<!-- Status Badge -->
<div class="absolute top-1/2 left-1/2 translate-x-4 -translate-y-12 bg-error text-on-error rounded-full p-xs border-2 border-surface flex items-center justify-center">
<span class="material-symbols-outlined text-sm font-bold" data-icon="block">block</span>
</div>
</div>
<h2 class="font-headline-md text-headline-md-mobile mb-sm text-on-surface">无法访问相册</h2>
<p class="text-on-surface-variant font-body-md px-2 leading-relaxed">
                    由于未获得相册访问权限，MineG 无法为您备份照片。请在系统设置中手动开启，以防回忆丢失。
                </p>
</div>
</div>
<!-- Action Buttons -->
<div class="w-full max-w-sm flex flex-col gap-md">
<button class="w-full bg-primary text-on-primary py-md px-lg rounded-xl font-headline-md text-sm hover:brightness-110 active:scale-[0.98] transition-all shadow-md">
                前往系统设置
            </button>
<button class="w-full text-outline font-label-sm py-sm hover:text-primary transition-colors">
                暂不开启
            </button>
</div>
<!-- Privacy Assurance -->
<div class="mt-xl flex items-center gap-xs text-outline opacity-60">
<span class="material-symbols-outlined text-sm" data-icon="shield">shield</span>
<span class="text-xs">MineG 采用端到端加密保护您的家庭回忆</span>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-sm pb-6 pt-2 bg-surface/80 backdrop-blur-md shadow-[0_-2px_12px_rgba(0,0,0,0.05)]">
<!-- Private Space -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:bg-surface-container-low transition-colors rounded-xl cursor-pointer">
<span class="material-symbols-outlined" data-icon="shield_person">shield_person</span>
<span class="font-label-sm text-label-sm mt-xs">私人空间</span>
</div>
<!-- Family Album -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:bg-surface-container-low transition-colors rounded-xl cursor-pointer">
<span class="material-symbols-outlined" data-icon="photo_library">photo_library</span>
<span class="font-label-sm text-label-sm mt-xs">家庭相册</span>
</div>
<!-- Backup (ACTIVE with Error Indicator) -->
<div class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-xl px-4 py-2 relative group active:scale-90 transition-all duration-150 cursor-pointer">
<span class="material-symbols-outlined" data-icon="cloud_upload">cloud_upload</span>
<span class="font-label-sm text-label-sm mt-xs font-bold">备份</span>
<!-- RED DOT / ERROR INDICATOR -->
<div class="absolute top-1 right-3 flex h-2 w-2">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-error opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-error"></span>
</div>
</div>
<!-- Trash -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:bg-surface-container-low transition-colors rounded-xl cursor-pointer">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
<span class="font-label-sm text-label-sm mt-xs">回收站</span>
</div>
<!-- Profile -->
<div class="flex flex-col items-center justify-center text-on-surface-variant px-3 py-1 hover:bg-surface-container-low transition-colors rounded-xl cursor-pointer">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-sm text-label-sm mt-xs">我的</span>
</div>
</nav>
<script>
        // Micro-interaction for the illustration
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.glass-panel');
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
        });
    </script>
</body></html>
