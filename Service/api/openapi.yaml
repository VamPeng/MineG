openapi: 3.1.0
info:
  title: MineG API
  version: 0.5.0
  description: Public ECS API contract. Stage03-v2 uploads original media directly to private OSS without client-side application encryption.
servers:
  - url: /
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [platform]
      responses:
        "200":
          description: Process is accepting HTTP requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
  /health/ready:
    get:
      operationId: getReadiness
      tags: [platform]
      responses:
        "200":
          description: Database is reachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/platform/probe:
    get:
      operationId: runPlatformProbe
      tags: [platform]
      summary: Unauthenticated integration probe; not a business API.
      responses:
        "200":
          description: API JSON and UTC timestamp contract is reachable.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformProbe" }
  /api/v1/auth/register:
    post:
      operationId: signUp
      tags: [auth]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignUpRequest" }
      responses:
        "201":
          description: A pending account was created, or the same idempotent result was recovered. Legacy key fields are optional compatibility input.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignUpResult" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/login:
    post:
      operationId: signIn
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInRequest" }
      responses:
        "200":
          description: A mobile session was created. Pending sessions are restricted to review status and logout operations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Access and refresh tokens were rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResult" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/logout:
    post:
      operationId: signOut
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: The current mobile session was revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusMessage" }
  /api/v1/auth/approval-status:
    get:
      operationId: getApprovalStatus
      tags: [auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Product-visible approval status. Administrator approval transitions directly to APPROVED.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalStatus" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/me:
    get:
      operationId: getProfile
      tags: [profile]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Minimal real profile for an approved member.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/me/profile:
    patch:
      operationId: updateProfile
      tags: [profile]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateProfileRequest" }
      responses:
        "200":
          description: The current approved member nickname was updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/me/avatar/uploads:
    post:
      operationId: createAvatarUpload
      tags: [profile]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAvatarUploadRequest" }
      responses:
        "201":
          description: A short-lived upload grant restricted to one avatar object was issued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarUploadResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/me/avatar/uploads/{upload_id}/complete:
    post:
      operationId: completeAvatarUpload
      tags: [profile]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/UploadId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Object metadata was verified and the avatar became the current profile image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/me/avatar:
    get:
      operationId: getAvatarReadGrant
      tags: [profile]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: A short-lived read grant for the current avatar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObjectGrant" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/uploads:
    post:
      operationId: createMediaUpload
      tags: [uploads]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMediaUploadRequest" }
      responses:
        "201":
          description: A resumable original-media multipart session was created, replayed, or converged to an existing same-account media.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUploadSession" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/uploads/{upload_id}:
    get:
      operationId: getMediaUpload
      tags: [uploads]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/UploadId" }
      responses:
        "200":
          description: Owner-scoped persisted upload truth. Object grants are omitted from status reads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUploadSession" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/uploads/{upload_id}/parts:
    post:
      operationId: reportMediaUploadPart
      tags: [uploads]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/UploadId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportMediaPartRequest" }
      responses:
        "200":
          description: The exact part ETag, content size, and digest were persisted; identical reports are idempotent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPartResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/uploads/{upload_id}/complete:
    post:
      operationId: completeMediaUpload
      tags: [uploads]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/UploadId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompleteMediaUploadRequest" }
      responses:
        "200":
          description: OSS multipart state was verified and a completed owner media was committed transactionally.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompleteMediaUploadResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/media:
    get:
      operationId: listCompletedOwnerMedia
      tags: [media]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Completed metadata owned by the authenticated member; no object URL or key envelope is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerMediaPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/private/media:
    get:
      operationId: listPrivateMedia
      tags: [media]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Owner-scoped completed, non-trashed media in a stable HMAC-bound seek page; no object URL is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateMediaPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/private/media/{media_id}:
    get:
      operationId: getPrivateMediaDetail
      tags: [media]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MediaId" }
      responses:
        "200":
          description: Owner-scoped media detail and registered resource metadata; object keys and grants are omitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateMediaDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/private/media/{media_id}/access:
    post:
      operationId: createPrivateMediaAccess
      tags: [media]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MediaId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivateMediaAccessRequest" }
      responses:
        "200":
          description: A fresh, short-lived owner-scoped GET authorization. The caller must not persist the grants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateMediaAccessResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/private/media/{media_id}/trash:
    post:
      operationId: trashPrivateMedia
      tags: [media]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MediaId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Media was logically trashed or the prior identical request was replayed. No OSS object is moved or removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateMediaTrashResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/private/media/{media_id}/share:
    post:
      operationId: setPrivateMediaShare
      tags: [sharing]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MediaId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetPrivateMediaShareRequest" }
      responses:
        "200":
          description: The owner-scoped family visibility reached the requested state; repeat requests are idempotent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateMediaShareResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/family/media:
    get:
      operationId: listFamilyMedia
      tags: [sharing]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [all, mine], default: all }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Active, non-trashed media shared inside the fixed household; mine filters before pagination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyMediaPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/family/media/{media_id}:
    get:
      operationId: getFamilyMediaDetail
      tags: [sharing]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MediaId" }
      responses:
        "200":
          description: Read-only metadata for an active fixed-household share; object keys are omitted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FamilyMediaDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/family/media/{media_id}/access:
    post:
      operationId: createFamilyMediaAccess
      tags: [sharing]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MediaId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FamilyMediaAccessRequest" }
      responses:
        "200":
          description: A short-lived read-only view or stream grant. Family access never supports DOWNLOAD.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateMediaAccessResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
  /api/v1/trash:
    get:
      operationId: listTrashMedia
      tags: [trash]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Active logical-trash records owned by the authenticated member, ordered by first trash time.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashMediaPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/trash/{media_id}/restore:
    post:
      operationId: restoreTrashMedia
      tags: [trash]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/MediaId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: The media was restored to private state and remains unshared.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrashMediaRestoreResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/help/faq:
    get:
      operationId: getFAQ
      tags: [feedback]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Versioned FAQ compatibility payload. The App retains an offline copy of the same subjects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FAQDocument" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/feedback:
    post:
      operationId: submitFeedback
      tags: [feedback]
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitFeedbackRequest" }
      responses:
        "201":
          description: Feedback was stored once; a repeated identical request returns the existing identifier.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubmitFeedbackResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/login:
    post:
      operationId: adminSignIn
      tags: [admin]
      parameters:
        - { $ref: "#/components/parameters/Origin" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginRequest" }
      responses:
        "200":
          description: Administrator session cookie was issued and a CSRF token returned.
          headers:
            Set-Cookie:
              description: Secure, HttpOnly, SameSite=Strict administrator session cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSessionResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/session:
    get:
      operationId: restoreAdminSession
      tags: [admin]
      security: [{ adminCookie: [] }]
      responses:
        "200":
          description: Active session was restored and its CSRF token rotated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSessionResult" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/logout:
    post:
      operationId: adminSignOut
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
      responses:
        "200":
          description: Administrator session was revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusMessage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/approvals:
    get:
      operationId: listApprovals
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Pending applications ordered oldest first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalPage" }
        "401": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/approvals/{approval_id}:
    get:
      operationId: getApproval
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ApprovalId" }
      responses:
        "200":
          description: Masked application detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /api/v1/admin/approvals/{approval_id}/approve:
    post:
      operationId: approveApplication
      tags: [admin]
      security: [{ adminCookie: [] }]
      parameters:
        - { $ref: "#/components/parameters/ApprovalId" }
        - { $ref: "#/components/parameters/Origin" }
        - { $ref: "#/components/parameters/CSRFToken" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Review decision is committed and the account becomes APPROVED. Repeats return ALREADY_PROCESSED.
          headers:
            X-CSRF-Token:
              description: Rotated CSRF token for the next state-changing request.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApproveResult" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    adminCookie:
      type: apiKey
      in: cookie
      name: mineg_admin_session
  headers:
    RequestId:
      description: Correlation identifier generated or accepted by the service.
      schema: { type: string, minLength: 8, maxLength: 128 }
  parameters:
    ApprovalId:
      name: approval_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaId:
      name: media_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Origin:
      name: Origin
      in: header
      required: true
      schema: { type: string, format: uri }
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 32 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string }
    PlatformProbe:
      type: object
      additionalProperties: false
      required: [status, api_version, server_time]
      properties:
        status: { type: string, enum: [ok] }
        api_version: { type: string, enum: [v1] }
        server_time: { type: string, format: date-time }
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [phone, password, device_installation_id, platform]
      properties:
        phone: { type: string, minLength: 11, maxLength: 14 }
        password: { type: string, minLength: 8, maxLength: 64 }
        device_installation_id: { type: string, minLength: 8, maxLength: 128 }
        platform: { type: string, enum: [ANDROID, IOS, HARMONYOS] }
    SignUpResult:
      type: object
      additionalProperties: false
      required: [user_id, access_token, access_expires_at, refresh_token, refresh_expires_at, approval_status, next_step]
      properties:
        user_id: { type: string, format: uuid }
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
        approval_status: { $ref: "#/components/schemas/ApprovalStatusValue" }
        next_step: { $ref: "#/components/schemas/NextStep" }
    SignInRequest:
      type: object
      additionalProperties: false
      required: [phone, password, device_installation_id, platform, agreement_accepted, terms_version, privacy_version]
      properties:
        phone: { type: string, minLength: 11, maxLength: 14 }
        password: { type: string, minLength: 1, maxLength: 64 }
        device_installation_id: { type: string, minLength: 8, maxLength: 128 }
        platform: { type: string, enum: [ANDROID, IOS, HARMONYOS] }
        agreement_accepted: { type: boolean, enum: [true] }
        terms_version: { type: string, minLength: 1, maxLength: 64 }
        privacy_version: { type: string, minLength: 1, maxLength: 64 }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 32 }
    TokenResult:
      type: object
      additionalProperties: false
      required: [user_id, access_token, access_expires_at, refresh_token, refresh_expires_at, approval_status, next_step]
      properties:
        user_id: { type: string, format: uuid }
        access_token: { type: string }
        access_expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
        approval_status: { $ref: "#/components/schemas/ApprovalStatusValue" }
        next_step: { $ref: "#/components/schemas/NextStep" }
    ApprovalStatus:
      type: object
      additionalProperties: false
      required: [status, next_step]
      properties:
        status: { $ref: "#/components/schemas/ApprovalStatusValue" }
        next_step: { $ref: "#/components/schemas/NextStep" }
    ApprovalStatusValue:
      type: string
      enum: [PENDING, APPROVED]
    NextStep:
      type: string
      enum: [REVIEW_PENDING, APP_HOME]
    Profile:
      type: object
      additionalProperties: false
      required: [id, nickname, masked_phone, version]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string, minLength: 2, maxLength: 20 }
        masked_phone: { type: string, pattern: "^[0-9]{3}\\*{4}[0-9]{4}$" }
        avatar_url: { type: string, format: uri }
        version: { type: integer, minimum: 1 }
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          pattern: "^[\\p{L}\\p{N} _-]+$"
    CreateAvatarUploadRequest:
      type: object
      additionalProperties: false
      required: [content_type, source_size, display_size, width, height, content_sha256]
      properties:
        content_type: { type: string, enum: [image/jpeg, image/png, image/heic, image/heif, image/webp] }
        source_size: { type: integer, minimum: 1, maximum: 10485760 }
        display_size: { type: integer, minimum: 1, maximum: 10485760 }
        width: { type: integer, minimum: 1, maximum: 1024 }
        height: { type: integer, minimum: 1, maximum: 1024 }
        content_sha256: { type: string, description: Unpadded standard base64 SHA-256 digest. }
    ObjectGrant:
      type: object
      additionalProperties: false
      required: [url, method, expires_at, headers]
      properties:
        url: { type: string, format: uri }
        method: { type: string, enum: [GET, PUT] }
        expires_at: { type: string, format: date-time }
        headers:
          type: object
          additionalProperties: { type: string }
    AvatarUploadResult:
      type: object
      additionalProperties: false
      required: [upload_id, grant]
      properties:
        upload_id: { type: string, format: uuid }
        grant: { $ref: "#/components/schemas/ObjectGrant" }
    MediaType:
      type: string
      enum: [PHOTO, VIDEO, GIF, LIVE_PHOTO, DYNAMIC]
    MediaResourceType:
      type: string
      enum: [ORIGINAL, THUMBNAIL, VIDEO_COVER, PREVIEW, LIVE_PHOTO_VIDEO, DYNAMIC_PREVIEW]
    MediaPartPlan:
      type: object
      additionalProperties: false
      required: [part_number, content_size, content_sha256]
      properties:
        part_number: { type: integer, minimum: 1, maximum: 10000 }
        content_size: { type: integer, minimum: 1, maximum: 4194304 }
        content_sha256: { type: string, description: Unpadded standard base64 SHA-256 of this original-media block. }
    MediaResourcePlan:
      type: object
      additionalProperties: false
      required: [resource_id, resource_type, content_size, content_sha256, parts]
      properties:
        resource_id: { type: string, format: uuid }
        resource_type: { $ref: "#/components/schemas/MediaResourceType" }
        mime_type: { type: string, minLength: 3, maxLength: 127, description: Required per resource by stage05-v1; inherited from the top-level MIME for older protocols. }
        content_size: { type: integer, minimum: 1 }
        content_sha256: { type: string, description: Unpadded standard base64 whole original-media digest. }
        parts:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: "#/components/schemas/MediaPartPlan" }
    CreateMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [protocol_version, client_media_id, content_sha256, content_revision, media_type, captured_at, mime_type, resources]
      properties:
        protocol_version: { type: string, enum: [stage03-v2, stage04-v1, stage05-v1] }
        client_media_id: { type: string, format: uuid, description: Stable client-generated media ID. }
        content_sha256: { type: string, description: Unpadded standard base64 SHA-256 of the original media bytes. }
        content_revision: { type: integer, minimum: 1 }
        media_type: { $ref: "#/components/schemas/MediaType" }
        captured_at: { type: string, format: date-time }
        mime_type: { type: string, minLength: 3, maxLength: 127 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        duration_ms: { type: integer, minimum: 0 }
        resources:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/MediaResourcePlan" }
        device_installation_id:
          type: string
          minLength: 8
          maxLength: 128
          description: Required for stage04-v1 when client album membership is supplied.
        client_albums:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/ClientAlbumRef" }
    ClientAlbumRef:
      type: object
      additionalProperties: false
      required: [client_album_id, name]
      properties:
        client_album_id: { type: string, minLength: 1, maxLength: 256 }
        name: { type: string, minLength: 1, maxLength: 256 }
    MediaPartGrant:
      type: object
      additionalProperties: false
      required: [part_number, grant]
      properties:
        part_number: { type: integer, minimum: 1, maximum: 10000 }
        grant: { $ref: "#/components/schemas/ObjectGrant" }
    MediaResourceGrant:
      type: object
      additionalProperties: false
      required: [resource_id, object_key, upload_id, parts]
      properties:
        resource_id: { type: string, format: uuid }
        object_key: { type: string, pattern: "^media/" }
        upload_id: { type: string }
        parts:
          type: array
          items: { $ref: "#/components/schemas/MediaPartGrant" }
    MediaUploadGrant:
      type: object
      additionalProperties: false
      required: [purpose, scope_prefix, expires_at, resources]
      properties:
        purpose: { type: string, enum: [MEDIA_ORIGINAL] }
        scope_prefix: { type: string, pattern: "^media/" }
        expires_at: { type: string, format: date-time }
        resources:
          type: array
          items: { $ref: "#/components/schemas/MediaResourceGrant" }
    MediaResourceStatus:
      type: object
      additionalProperties: false
      required: [resource_id, resource_type, part_count, uploaded_parts, confirmed_part_numbers]
      properties:
        resource_id: { type: string, format: uuid }
        resource_type: { $ref: "#/components/schemas/MediaResourceType" }
        object_key: { type: string, pattern: "^media/" }
        content_size: { type: integer, minimum: 1 }
        part_count: { type: integer, minimum: 1, maximum: 10000 }
        uploaded_parts: { type: integer, minimum: 0, maximum: 10000 }
        confirmed_part_numbers:
          type: array
          description: Exact server-confirmed multipart part numbers for safe client recovery.
          items: { type: integer, minimum: 1, maximum: 10000 }
    MediaUploadSession:
      type: object
      additionalProperties: false
      required: [id, client_media_id, state, purpose, deduplicated, grant_generation, expires_at, resources]
      properties:
        id: { type: string, format: uuid }
        client_media_id: { type: string, format: uuid }
        state: { type: string, enum: [PENDING, VERIFYING, COMPLETED, EXPIRED, INVALID] }
        purpose: { type: string, enum: [MEDIA_ORIGINAL] }
        media_id: { type: string, format: uuid }
        deduplicated: { type: boolean }
        grant_generation: { type: integer, minimum: 1 }
        expires_at: { type: string, format: date-time }
        grant: { $ref: "#/components/schemas/MediaUploadGrant" }
        resources:
          type: array
          items: { $ref: "#/components/schemas/MediaResourceStatus" }
    ReportMediaPartRequest:
      type: object
      additionalProperties: false
      required: [resource_id, part_number, content_size, content_sha256, etag]
      properties:
        resource_id: { type: string, format: uuid }
        part_number: { type: integer, minimum: 1, maximum: 10000 }
        content_size: { type: integer, minimum: 1, maximum: 4194304 }
        content_sha256: { type: string }
        etag: { type: string, minLength: 1, maxLength: 256 }
    MediaPartResult:
      type: object
      additionalProperties: false
      required: [upload_id, resource_id, part_number, state]
      properties:
        upload_id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        part_number: { type: integer }
        state: { type: string, enum: [UPLOADED] }
    CompleteMediaUploadRequest:
      type: object
      additionalProperties: false
      properties: {}
    CompleteMediaUploadResult:
      type: object
      additionalProperties: false
      required: [upload_id, media_id, state, outcome, deduplicated]
      properties:
        upload_id: { type: string, format: uuid }
        media_id: { type: string, format: uuid }
        state: { type: string, enum: [COMPLETED] }
        outcome: { type: string, enum: [COMPLETED, ALREADY_COMPLETED, DEDUPLICATED] }
        deduplicated: { type: boolean }
    OwnerMediaSummary:
      type: object
      additionalProperties: false
      required: [id, media_type, content_revision, captured_at, created_at]
      properties:
        id: { type: string, format: uuid }
        media_type: { $ref: "#/components/schemas/MediaType" }
        content_revision: { type: integer, minimum: 1 }
        captured_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    OwnerMediaPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OwnerMediaSummary" }
        next_cursor: { type: string }
    PrivateMediaResource:
      type: object
      additionalProperties: false
      required: [resource_id, resource_type, mime_type, content_size, content_sha256]
      properties:
        resource_id: { type: string, format: uuid }
        resource_type: { $ref: "#/components/schemas/MediaResourceType" }
        mime_type: { type: string, minLength: 3, maxLength: 127 }
        content_size: { type: integer, minimum: 1 }
        content_sha256: { type: string, description: Unpadded standard base64 SHA-256 digest. }
    PrivateMediaSummary:
      type: object
      additionalProperties: false
      required: [id, media_type, captured_at, created_at, original_total_size]
      properties:
        id: { type: string, format: uuid }
        media_type: { $ref: "#/components/schemas/MediaType" }
        captured_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        duration_ms: { type: integer, minimum: 0 }
        original_total_size: { type: integer, minimum: 0 }
        preview_resource: { $ref: "#/components/schemas/PrivateMediaResource" }
    PrivateMediaPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/PrivateMediaSummary" }
        next_cursor: { type: string, nullable: true }
    PrivateMediaDetail:
      type: object
      additionalProperties: false
      required: [id, media_type, captured_at, created_at, original_total_size, resources]
      properties:
        id: { type: string, format: uuid }
        media_type: { $ref: "#/components/schemas/MediaType" }
        captured_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        duration_ms: { type: integer, minimum: 0 }
        original_total_size: { type: integer, minimum: 0 }
        resources:
          type: array
          items: { $ref: "#/components/schemas/PrivateMediaResource" }
    PrivateMediaAccessRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose: { type: string, enum: [VIEW, STREAM] }
        variant:
          type: string
          enum: [THUMBNAIL, DETAIL]
          description: THUMBNAIL returns a display thumbnail. For VIEW, DETAIL returns the exact ORIGINAL resource for image media and a preview or cover resource for VIDEO.
    PrivateMediaAccessResource:
      type: object
      additionalProperties: false
      required: [resource_id, resource_type, mime_type, content_size, content_sha256, supports_range, delivery_mode, grant]
      properties:
        resource_id: { type: string, format: uuid }
        resource_type: { $ref: "#/components/schemas/MediaResourceType" }
        mime_type: { type: string, minLength: 3, maxLength: 127 }
        content_size: { type: integer, minimum: 1 }
        content_sha256: { type: string }
        supports_range: { type: boolean }
        delivery_mode:
          type: string
          enum: [ORIGINAL_RESOURCE, OSS_IMAGE_THUMBNAIL]
          description: ORIGINAL_RESOURCE returns the registered bytes. OSS_IMAGE_THUMBNAIL returns an on-the-fly OSS image transformation of the registered ORIGINAL; content_size/content_sha256 describe that source object and must not be used to validate transformed bytes.
        maximum_output_size:
          type: integer
          minimum: 1
          maximum: 5242880
          description: Required for OSS_IMAGE_THUMBNAIL; the transformed image byte limit enforced by the client.
        grant: { $ref: "#/components/schemas/ObjectGrant" }
    PrivateMediaAccessResult:
      type: object
      additionalProperties: false
      required: [media_id, purpose, issued_at, expires_at, resources]
      properties:
        media_id: { type: string, format: uuid }
        purpose: { type: string, enum: [VIEW, STREAM] }
        variant: { type: string, enum: [THUMBNAIL, DETAIL] }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        resources:
          type: array
          items: { $ref: "#/components/schemas/PrivateMediaAccessResource" }
    PrivateMediaTrashResult:
      type: object
      additionalProperties: false
      required: [media_id, outcome, trashed_at]
      properties:
        media_id: { type: string, format: uuid }
        outcome: { type: string, enum: [TRASHED, ALREADY_TRASHED] }
        trashed_at: { type: string, format: date-time }
    SetPrivateMediaShareRequest:
      type: object
      additionalProperties: false
      required: [shared]
      properties:
        shared: { type: boolean }
    PrivateMediaShareResult:
      type: object
      additionalProperties: false
      required: [media_id, state, outcome, effective_at]
      properties:
        media_id: { type: string, format: uuid }
        state: { type: string, enum: [ACTIVE, INACTIVE] }
        outcome: { type: string, enum: [SHARED, ALREADY_SHARED, UNSHARED, ALREADY_UNSHARED] }
        effective_at: { type: string, format: date-time }
    FamilyMediaOwner:
      type: object
      additionalProperties: false
      required: [id, nickname]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string, minLength: 2, maxLength: 20 }
    FamilyMediaSummary:
      type: object
      additionalProperties: false
      required: [id, owner, media_type, captured_at, created_at, original_total_size]
      properties:
        id: { type: string, format: uuid }
        owner: { $ref: "#/components/schemas/FamilyMediaOwner" }
        media_type: { $ref: "#/components/schemas/MediaType" }
        captured_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        duration_ms: { type: integer, minimum: 0 }
        original_total_size: { type: integer, minimum: 0 }
    FamilyMediaPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FamilyMediaSummary" }
        next_cursor: { type: string, nullable: true }
    FamilyMediaDetail:
      type: object
      additionalProperties: false
      required: [id, owner, media_type, captured_at, created_at, original_total_size, resources]
      properties:
        id: { type: string, format: uuid }
        owner: { $ref: "#/components/schemas/FamilyMediaOwner" }
        media_type: { $ref: "#/components/schemas/MediaType" }
        captured_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        duration_ms: { type: integer, minimum: 0 }
        original_total_size: { type: integer, minimum: 0 }
        resources:
          type: array
          items: { $ref: "#/components/schemas/PrivateMediaResource" }
    FamilyMediaAccessRequest:
      type: object
      additionalProperties: false
      required: [purpose]
      properties:
        purpose: { type: string, enum: [VIEW, STREAM] }
        variant: { type: string, enum: [THUMBNAIL, DETAIL] }
    TrashMediaSummary:
      type: object
      additionalProperties: false
      required: [id, media_type, captured_at, created_at, original_total_size, trashed_at]
      properties:
        id: { type: string, format: uuid }
        media_type: { $ref: "#/components/schemas/MediaType" }
        captured_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        duration_ms: { type: integer, minimum: 0 }
        original_total_size: { type: integer, minimum: 0 }
        trashed_at: { type: string, format: date-time }
    TrashMediaPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TrashMediaSummary" }
        next_cursor: { type: string, nullable: true }
    TrashMediaRestoreResult:
      type: object
      additionalProperties: false
      required: [media_id, outcome, restored_at]
      properties:
        media_id: { type: string, format: uuid }
        outcome: { type: string, enum: [RESTORED, ALREADY_RESTORED] }
        restored_at: { type: string, format: date-time }
    FAQItem:
      type: object
      additionalProperties: false
      required: [id, question, answer]
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }
    FAQDocument:
      type: object
      additionalProperties: false
      required: [version, items]
      properties:
        version: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/FAQItem" }
    SubmitFeedbackRequest:
      type: object
      additionalProperties: false
      required: [category, description, app_version, platform, os_version, device_installation_id]
      properties:
        category: { type: string, enum: [ACCOUNT, PERMISSION, BACKUP, BROWSE_PLAYBACK, SHARING, TRASH, OTHER] }
        description: { type: string, minLength: 1, maxLength: 1000 }
        contact: { type: string, minLength: 1, maxLength: 200 }
        app_version: { type: string, minLength: 1, maxLength: 64 }
        platform: { type: string, enum: [ANDROID, IOS, HARMONYOS] }
        os_version: { type: string, minLength: 1, maxLength: 128 }
        device_installation_id: { type: string, minLength: 8, maxLength: 128 }
    SubmitFeedbackResult:
      type: object
      additionalProperties: false
      required: [feedback_id, outcome, created_at]
      properties:
        feedback_id: { type: string, format: uuid }
        outcome: { type: string, enum: [SUBMITTED, ALREADY_SUBMITTED] }
        created_at: { type: string, format: date-time }
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 64 }
        password: { type: string, minLength: 1, maxLength: 64 }
    AdminSessionResult:
      type: object
      additionalProperties: false
      required: [csrf_token, username]
      properties:
        csrf_token: { type: string }
        username: { type: string }
    Approval:
      type: object
      additionalProperties: false
      required: [id, masked_phone, status, created_at]
      properties:
        id: { type: string, format: uuid }
        masked_phone: { type: string, pattern: "^[0-9]{3}\\*{4}[0-9]{4}$" }
        status: { type: string, enum: [PENDING, PROCESSED] }
        created_at: { type: string, format: date-time }
    ApprovalPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Approval" }
        next_cursor:
          type: string
          nullable: true
    ApproveResult:
      type: object
      additionalProperties: false
      required: [approval, outcome]
      properties:
        approval: { $ref: "#/components/schemas/Approval" }
        outcome: { type: string, enum: [APPROVED, ALREADY_PROCESSED] }
    StatusMessage:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, request_id, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, pattern: "^[A-Z][A-Z0-9_]+$" }
        request_id: { type: string }
        retryable: { type: boolean }
        details: { type: object, additionalProperties: true }
  responses:
    Problem:
      description: RFC 9457 problem details with stable MineG extensions.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
