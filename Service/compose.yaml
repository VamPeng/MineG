services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: mineg
      POSTGRES_USER: mineg
      POSTGRES_PASSWORD: local-only-change-me
      TZ: UTC
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mineg -d mineg"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - mineg-postgres:/var/lib/postgresql

volumes:
  mineg-postgres:
